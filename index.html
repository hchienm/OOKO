const DB='ooko5';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error)})}
async function dbG(k){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>r2(r.result??null);r.onerror=()=>rj(r.error)})}catch{return null}}
async function dbS(k,v){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>r2(true);r.onerror=()=>rj(r.error)})}catch{return false}}
async function loadA(k){try{const r=await dbG(k);return r?JSON.parse(r):[]}catch{return[]}}
async function loadO(k,d){try{const r=await dbG(k);return r?JSON.parse(r):d}catch{return d}}
async function saveA(k,d){await dbS(k,JSON.stringify(d))}
async function saveO(k,d){await dbS(k,JSON.stringify(d))}
// 照片存取（每張獨立存，key = photo_{id}）
async function savePhoto(id,dataUrl){await dbS('photo_'+id,dataUrl);}
async function loadPhoto(id){try{return await dbG('photo_'+id)||null;}catch{return null;}}
async function delPhoto(id){try{const db=await openDB();return new Promise((r)=>{const req=db.transaction('kv','readwrite').objectStore('kv').delete('photo_'+id);req.onsuccess=()=>r(true);req.onerror=()=>r(false);});}catch{return false;}}

// 執行製作：依配方扣原料、加成品
async function doProduce(prodName,qty){
  const prod=S.prods.find(p=>p.name===prodName);
  const prodItem=findProdInvItem(prodName);
  if(!prodItem){showToast('找不到成品「'+prodName+'」');return false;}
  if(!prod||!prod.recipe||prod.recipe.filter(r=>r.itemId).length===0){
    showToast('此產品尚未設定配方');return false;
  }
  
  const warnings=[];
  const consumedList=[];
  for(const r of prod.recipe){
    if(!r.itemId)continue;
    const item=S.invItems.find(i=>i.id===r.itemId);
    if(!item)continue;
    const need=(parseFloat(r.qty)||0)*qty;
    if(item.qty<need)warnings.push(`${item.name}不足(需${need}${item.unit}有${item.qty}${item.unit})`);
    const used=Math.min(item.qty,need);
    item.qty=Math.max(0,item.qty-need);
    consumedList.push({itemId:r.itemId,name:item.name,qty:used,need});
  }
  prodItem.qty+=qty;
  const tx={id:uid(),date:toDay(),itemId:prodItem.id,itemName:prodName,type:'produce',qty,unitCost:0,store:'',
    note:`製作 ${qty} ${prodItem.unit||'瓶'}（依配方）`,
    materials:{recipe:consumedList,qty}};
  S.invTx=[tx,...S.invTx];
  await saveA('inv_items',S.invItems);
  await saveA('inv_tx',S.invTx);
  if(warnings.length)showToast('⚠ 已製作！'+warnings[0]);
  else showToast(`✓ 已製作 ${qty} ${prodItem.unit||'瓶'} ${prodName} 🧪`);
  return true;
}

// 取消製作（刪除製作記錄時，反向操作）
async function undoProduce(tx){
  if(tx.type!=='produce'||!tx.materials)return;
  const m=tx.materials;
  const prodItem=findProdInvItem(tx.itemName);
  if(prodItem)prodItem.qty=Math.max(0,prodItem.qty-tx.qty);
  
  // 新版配方還原
  if(m.recipe&&Array.isArray(m.recipe)){
    for(const c of m.recipe){
      const item=S.invItems.find(i=>i.id===c.itemId);
      if(item)item.qty+=c.need||c.qty||0;
    }
    await saveA('inv_items',S.invItems);
    return;
  }
  
  // 後備：舊版還原
  const c=m.consumed||{};
  const findById=id=>S.invItems.find(i=>i.id===id);
  if(m.baseId&&findById(m.baseId))findById(m.baseId).qty+=c.base||m.base||0;
  if(m.eoId&&findById(m.eoId))findById(m.eoId).qty+=c.eo||m.eo||0;
  if(m.bottleId&&findById(m.bottleId))findById(m.bottleId).qty+=c.bottle||tx.qty;
  if(m.capId&&findById(m.capId))findById(m.capId).qty+=c.cap||tx.qty;
  if(m.plugId&&findById(m.plugId))findById(m.plugId).qty+=c.plug||tx.qty;
  if(m.fiberId&&findById(m.fiberId))findById(m.fiberId).qty+=c.fiber||(tx.qty*6);
  if(m.sleeveId&&findById(m.sleeveId))findById(m.sleeveId).qty+=c.sleeve||(tx.qty*6);
  if(m.stickerId&&findById(m.stickerId))findById(m.stickerId).qty+=c.sticker||tx.qty;
  await saveA('inv_items',S.invItems);
}

// 從成品庫存扣除（不阻擋，記錄警告）
async function deductFinishedStock(prodName,qty){
  const item=findProdInvItem(prodName);
  if(!item){return{ok:false,msg:'找不到成品庫存「'+prodName+'」'};}
  const before=item.qty;
  item.qty=Math.max(0,item.qty-qty);
  await saveA('inv_items',S.invItems);
  if(before<qty)return{ok:true,warn:true,msg:'⚠ 庫存不足！「'+prodName+'」只有 '+before+' 瓶，已扣為 0'};
  return{ok:true,warn:false};
}
// 加回成品庫存（用於刪除/編輯銷售時還原）
async function restoreFinishedStock(prodName,qty){
  const item=findProdInvItem(prodName);
  if(!item)return false;
  item.qty+=qty;
  await saveA('inv_items',S.invItems);
  return true;
}

async function handlePhotoUpload(id,file){
  if(!file)return;
  const MAX=800; // 最大邊長 px
  const reader=new FileReader();
  reader.onload=async e=>{
    // 壓縮到合理大小
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement('canvas');
      const scale=Math.min(1,MAX/Math.max(img.width,img.height));
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',0.82);
      S.photos[id]=dataUrl;
      await savePhoto(id,dataUrl);
      delete S.modals.viewPhoto; // 關閉放大視圖
      showToast('✓ 照片已儲存 📷');re();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function invStock(){
  const cat=S.forms.invCat||'全部';
  const cats=['全部',...(S.settings.invCats||['原料','包材','成品','其他'])];
  const items=cat==='全部'?S.invItems:S.invItems.filter(i=>i.cat===cat);
  const specs=S.settings.productSpecs||[{name:'擴香瓶',base:104,eo:26}];
  const baseItem=S.invItems.find(i=>i.name.includes('基底擴香液')||i.name.includes('基底'));
  const eoItem=S.invItems.find(i=>i.name.includes('精油')&&i.unit==='ml');
  const estimates=specs.filter(sp=>sp.base>0||sp.eo>0).map(sp=>{
    const fb=baseItem&&sp.base>0?Math.floor(baseItem.qty/sp.base):null;
    const fe=eoItem&&sp.eo>0?Math.floor(eoItem.qty/sp.eo):null;
    const can=fb!=null&&fe!=null?Math.min(fb,fe):fb!=null?fb:fe;
    return can!=null?{name:sp.name,can}:null;
  }).filter(Boolean);
  return`${estimates.length?`<div style="background:var(--mintL);border:2px solid var(--mintM);border-radius:12px;padding:12px 16px;margin-bottom:12px">
  <div style="font-size:11px;font-weight:700;color:var(--mint);margin-bottom:6px">🧪 目前材料可生產</div>
  ${estimates.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--mintM)"><span style="font-size:12px;color:var(--green)">${esc(e.name)}</span><span style="font-size:18px;font-weight:800;color:var(--green)">${e.can} 瓶</span></div>`).join('')}
</div>`:''}

  const barColor=low?'var(--coral)':pct>80?'var(--mint)':'var(--lemonD)';
  return`<div class="ic${low?' low':''}">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div class="drag-handle" draggable="true" data-drag-id="${item.id}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:26px;margin-right:8px;flex-shrink:0;gap:3px;padding:4px 0">
      <div style="width:14px;height:2px;background:var(--muted);border-radius:1px"></div>
      <div style="width:14px;height:2px;background:var(--muted);border-radius:1px"></div>
      <div style="width:14px;height:2px;background:var(--muted);border-radius:1px"></div>

    <div style="flex:1;min-width:0">

        <div style="font-size:10px;color:var(--muted);white-space:nowrap">安全線 ${item.safe} ${esc(item.unit)}</div>
      </div>

    <div style="text-align:right;flex-shrink:0;margin-left:8px">
      <div style="font-size:26px;font-weight:800;color:${low?'var(--coral)':'var(--ink)'};line-height:1">${item.qty}<span style="font-size:12px;font-weight:500;color:var(--muted);margin-left:2px">${esc(item.unit)}</span></div>

  if(S.modals.stocktake)h+=stocktakeModal();
  if(S.modals.repTxt)h+=repTxtModal();
  if(S.modals.produce)h+=produceModal();
  // 照片放大 overlay
  if(S.modals.viewPhoto){
    const src=S.photos[S.modals.viewPhoto]||'';
    const item=S.invItems.find(i=>i.id===S.modals.viewPhoto);
    h+=`<div class="photo-overlay" data-a="closeM" data-m="viewPhoto">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
        <img src="${src}" alt="" style="max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain">
        <div style="display:flex;gap:8px">
          <span style="color:white;font-size:13px;font-weight:700">${esc(item?.name||'')}</span>
        </div>
        <div style="display:flex;gap:8px">
          <label style="padding:10px 18px;background:white;color:#333;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer">🔄 換照片<input type="file" accept="image/*" style="display:none" data-a="uploadPhoto" data-id="${S.modals.viewPhoto}"></label>

function produceModal(){
  const f=S.forms.produceF||{prodName:S.prods[0]?.name||'',qty:''};
  const prod=S.prods.find(p=>p.name===f.prodName);
  const qty=parseInt(f.qty)||0;
  const recipe=(prod&&prod.recipe)||[];
  const validRecipe=recipe.filter(r=>r.itemId);
  
  return`<div class="overlay" data-a="closeM" data-m="produce"><div class="modal" onclick="event.stopPropagation()">
${MH('🧪 製作 Produce','依配方扣料、加成品')}
<div class="mb">
  <div class="f"><label>製作產品</label>
    <select class="inp" data-b="produceF.prodName">${S.prods.length===0?'<option value="">— 尚無產品 —</option>':S.prods.map(p=>{const has=p.recipe&&p.recipe.filter(r=>r.itemId).length>0;return`<option value="${esc(p.name)}"${f.prodName===p.name?' selected':''}>${has?'✓ ':'⚠ '}${esc(p.name)} (Lv${p.level||1})${has?'':'（未設配方）'}</option>`}).join('')}</select>
  </div>
  
  ${!prod?`<div style="background:var(--coralL);border:2px solid var(--coralM);border-radius:12px;padding:14px;margin-bottom:12px;text-align:center;font-size:12px;color:var(--coral);font-weight:700">請先選擇產品</div>`
  :validRecipe.length===0?`<div style="background:var(--lemonL);border:2px solid var(--lemonD);border-radius:12px;padding:14px;margin-bottom:12px">
    <div style="font-size:13px;font-weight:800;color:#7A6000;margin-bottom:8px">⚠ 此產品尚未設定配方</div>
    <div style="font-size:11px;color:#7A6000;line-height:1.6;margin-bottom:10px">每個產品需要先在「設定 → 產品管理」設定配方（要消耗哪些材料、每瓶多少），製作時才會自動扣料。</div>
    <button class="btn bm" style="font-size:12px;padding:10px;margin-bottom:6px" data-a="autoBuildRecipe" data-name="${esc(prod.name)}">🪄 為此產品建立預設配方（擴香瓶用）</button>
    <button class="btn bo" style="font-size:11px;padding:9px" data-a="goSettingsRecipe">前往設定頁設定配方</button>
  </div>`
  :`<div class="f"><label>製作數量（瓶）</label>
    <input class="inp" type="number" min="1" value="${esc(f.qty)}" data-b="produceF.qty" placeholder="0" style="font-size:22px;font-weight:800;text-align:center">
  </div>
  ${qty>0?`<div style="background:var(--peach);border:2px solid var(--peachD);border-radius:12px;padding:12px 16px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px">📋 將消耗的原料（依配方）</div>
    ${validRecipe.map(r=>{
      const item=S.invItems.find(i=>i.id===r.itemId);
      if(!item)return`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdL);color:var(--coral);font-size:11px;font-weight:700">⚠ 配方中有材料已被刪除</div>`;
      const need=(parseFloat(r.qty)||0)*qty;
      const ok=item.qty>=need;
      return`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bdL)">
        <span style="font-size:11px;${!ok?'color:var(--coral);font-weight:700':''}">${esc(item.name)}</span>
        <span style="font-size:12px;font-weight:700;color:${ok?'var(--green)':'var(--coral)'}">需${need}${esc(item.unit)} 有${item.qty}${esc(item.unit)} ${ok?'✓':'⚠'}</span>
      </div>`;
    }).join('')}
  </div>
  <div style="background:var(--mintL);border:2px solid var(--mintM);border-radius:12px;padding:12px 16px;margin-bottom:12px;text-align:center">
    <div style="font-size:11px;font-weight:700;color:var(--mint)">產出 Output</div>
    <div style="font-size:24px;font-weight:800;color:var(--green)">+${qty} ${findProdInvItem(prod.name)?.unit||'瓶'} ${esc(prod.name)}</div>
  </div>`:''}`}
  
  ${validRecipe.length>0?`<button class="btn bm" data-a="confirmProduce" style="margin-bottom:8px">✓ 確認製作</button>`:''}
  <button class="btn bo" data-a="closeM" data-m="produce">取消</button>
</div></div></div>`;
}

// BINDING & ACTIONS
function bindAll(){
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{S.tab=el.dataset.tab;re();}));
  document.querySelectorAll('[data-b]').forEach(el=>{
    el.addEventListener('input',()=>bind(el.dataset.b,el.value));
    el.addEventListener('change',()=>bind(el.dataset.b,el.value));
  });
  document.querySelectorAll('[data-a]').forEach(el=>{
    if(el.tagName==='INPUT'&&el.type==='file'){
      el.addEventListener('change',()=>{
        if(el.files[0]){
          if(el.dataset.a==='importJSON')importJSON(el.files[0]);
          else if(el.dataset.a==='uploadPhoto')handlePhotoUpload(el.dataset.id,el.files[0]);
        }
      });
      return;
    }
    el.addEventListener('click',e=>{e.stopPropagation();act(el.dataset.a,el.dataset);});
  });
  initDrag();
}

function bind(path,val){
  const p=path.split('.');
  if(p[0]==='sal'){if(!S.forms.sal)S.forms.sal={date:toDay(),prodIdx:0,qty:1,channel:S.channels.find(c=>!c.includes('寄賣'))||S.channels[0]};S.forms.sal[p[1]]=p[1]==='prodIdx'?parseInt(val):val;if(p[1]==='qty'||p[1]==='prodIdx')re();}
  else if(p[0]==='salC'){if(!S.forms.salC)S.forms.salC={date:toDay(),prodIdx:0,qty:1};S.forms.salC[p[1]]=p[1]==='prodIdx'?parseInt(val):val;if(p[1]==='prodIdx')re();}
  else if(p[0]==='exp'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:S.expCats[0],description:'',amount:'',currency:'TWD',origin:'',payMethod:PAY[0],supplier:'',note:''};S.forms.exp[p[1]]=val;if(p[1]==='currency')re();}
  else if(p[0]==='invF'){if(!S.forms.invF)S.forms.invF={date:toDay(),itemId:'',type:'in',qty:'',currency:'TWD',unitCost:'',store:'',note:''};S.forms.invF[p[1]]=val;if(p[1]==='type'||p[1]==='currency')re();}
  else if(p[0]==='customF'){if(!S.forms.customF)S.forms.customF={date:toDay(),customerName:'',product:'',totalAmt:'',depositAmt:'',depositDate:toDay(),status:'pending',note:'',customCost:'',isConsign:false,consignStore:getStores()[0]||'moonstone',consignRate:0.70};S.forms.customF[p[1]]=val;if(p[1]==='isConsign')re();}
  else if(p[0]==='newItem'){if(!S.forms.newItem)S.forms.newItem={name:'',en:'',cat:'包材',unit:'個',qty:0,safe:10,unitCost:0};S.forms.newItem[p[1]]=val;}
  else if(p[0]==='sendF'){if(!S.forms.sendF)S.forms.sendF={date:toDay(),store:getStores()[0]||'moonstone',prodName:'',qty:'',note:''};S.forms.sendF[p[1]]=val;}
  else if(p[0]==='qkF'){if(!S.forms.qkF)S.forms.qkF={qty:'',unitCost:'',note:''};S.forms.qkF[p[1]]=val;}
  else if(p[0]==='produceF'){if(!S.forms.produceF)S.forms.produceF={prodName:S.prods[0]?.name||'',qty:''};S.forms.produceF[p[1]]=val;if(p[1]==='prodName')re();}
  else if(p[0]==='repM'){S.forms.repM=val;re();}
  else if(p[0]==='repY'){S.forms.repY=val;re();}
  else if(p[0]==='ptIdx'){S.forms.ptIdx=parseInt(val);re();}
  else if(p[0]==='editExp'&&p.length===3){if(S.forms['editExp_'+p[1]])S.forms['editExp_'+p[1]][p[2]]=val;}
  else if(p[0]==='editSal'&&p.length===3){if(S.forms['editSal_'+p[1]])S.forms['editSal_'+p[1]][p[2]]=val;}
  else if(p[0]==='stkPending'&&p.length===2){if(!S.forms.stkPending)S.forms.stkPending={};S.forms.stkPending[p[1]]=val;}
  else if(p[0]==='invItem'&&p.length===3){const i=parseInt(p[1]);if(S.invItems[i])S.invItems[i][p[2]]=p[2]==='safe'?parseInt(val)||0:p[2]==='unitCost'?parseFloat(val)||0:val;}
  else if(p[0]==='settings'){
    const fv=parseFloat(val)||0;
    if(['reserveRate','salaryAmt','baseCost','targetMargin'].includes(p[1]))S.settings[p[1]]=fv;
    else if(p[1]==='consignFreq')S.settings.consignFreq=val;
  }
  else if(p[0]==='consignRate'){const stores=getStores();const si=parseInt(p[1]);if(!S.settings.consign)S.settings.consign={...DEF_CONSIGN};if(stores[si])S.settings.consign[stores[si]+' 寄賣']=parseFloat(val)||0.70;}
  else if(p[0]==='prodSpec'){if(!S.settings.productSpecs)S.settings.productSpecs=[{name:'擴香瓶',base:104,eo:26,fiber:6}];const si=parseInt(p[1]);if(S.settings.productSpecs[si])S.settings.productSpecs[si][p[2]]=(p[2]==='base'||p[2]==='eo'||p[2]==='fiber')?parseFloat(val)||0:val;}
  else if(p[0]==='currency'){const idx=getCurs().findIndex(c=>c.code===p[1]);if(idx>=0)S.settings.currencies[idx].rate=parseFloat(val)||1;}
  else if(p[0]==='expCat'){const i=parseInt(p[1]);if(S.expCats[i]!==undefined)S.expCats[i]=val;}
  else if(p[0]==='channel'){const i=parseInt(p[1]);if(S.channels[i]!==undefined)S.channels[i]=val;}
  else if(p[0]==='storeName'){const i=parseInt(p[1]);if(!S.settings.consignStores)S.settings.consignStores=[...DEF_STORES];const oldName=S.settings.consignStores[i];const newName=val.trim();if(oldName&&newName&&oldName!==newName){S.settings.consignStores[i]=newName;if(S.settings.consign){S.settings.consign[newName+' 寄賣']=S.settings.consign[oldName+' 寄賣']||0.70;delete S.settings.consign[oldName+' 寄賣'];}S.channels=S.channels.map(ch=>ch===oldName+' 寄賣'?newName+' 寄賣':ch);}}
  else if(p[0]==='invCat'){const i=parseInt(p[1]);if(!S.settings.invCats)S.settings.invCats=['原料','包材','成品','其他'];if(S.settings.invCats[i]!==undefined)S.settings.invCats[i]=val;}
  else if(p[0]==='newStoreName'){S.forms.newStoreName=val;}
  else if(p[0]==='newCatName'){S.forms.newCatName=val;}
  else if(p[0]==='newInvCatName'){S.forms.newInvCatName=val;}
  else if(p[0]==='newChannelName'){S.forms.newChannelName=val;}
  else if(p[0]==='newCurrency'&&p.length===2){if(!S.forms.newCurrencyData)S.forms.newCurrencyData={code:'',name:'',rate:'',symbol:''};S.forms.newCurrencyData[p[1]]=val;}
  else if(p[0]==='newProdSpec'&&p.length===2){if(!S.forms.newProdSpecData)S.forms.newProdSpecData={name:'',base:0,eo:0};S.forms.newProdSpecData[p[1]]=p[1]==='base'||p[1]==='eo'?parseFloat(val)||0:val;}
  else if(p[0]==='newProd'&&p.length===2){if(!S.forms.newProdData)S.forms.newProdData={name:'',en:'',price:780,eoC:80};S.forms.newProdData[p[1]]=p[1]==='price'||p[1]==='eoC'?parseFloat(val)||0:val;}
  else if(p[0]==='newInvItem'&&p.length===2){if(!S.forms.newInvItemData)S.forms.newInvItemData={name:'',en:'',cat:'包材',unit:'個',qty:0,safe:10,unitCost:0};S.forms.newInvItemData[p[1]]=['qty','safe'].includes(p[1])?parseInt(val)||0:p[1]==='unitCost'?parseFloat(val)||0:val;}
  else if(p[0]==='prod'&&p.length===3){const i=parseInt(p[1]);if(S.prods[i])S.prods[i][p[2]]=p[2]==='price'||p[2]==='eoC'?parseFloat(val)||0:p[2]==='level'?parseInt(val)||1:val;}
  else if(p[0]==='prodTotal'){const i=parseInt(p[1]);const total=parseFloat(val)||0;const base=S.settings.baseCost||118;if(S.prods[i])S.prods[i].eoC=Math.max(0,total-base);}
  else if(p[0]==='recipe'&&p.length===4){
    const pi=parseInt(p[1]),ri=parseInt(p[2]),f=p[3];
    if(!S.prods[pi])return;
    if(!S.prods[pi].recipe)S.prods[pi].recipe=[];
    if(!S.prods[pi].recipe[ri])S.prods[pi].recipe[ri]={itemId:'',qty:0};
    S.prods[pi].recipe[ri][f]=f==='qty'?parseFloat(val)||0:val;
  }
}

async function act(a,d){

  else if(a==='setSalV'){S.forms.salV=d.v;re();}

  else if(a==='toggleCustomConsign'){if(!S.forms.customF)S.forms.customF={date:toDay(),customerName:'',product:'',totalAmt:'',depositAmt:'',depositDate:toDay(),status:'pending',note:'',customCost:'',isConsign:false,consignStore:getStores()[0]||'moonstone',consignRate:0.70};S.forms.customF.isConsign=!S.forms.customF.isConsign;re();}
  else if(a==='selProd'){if(!S.forms.sal)S.forms.sal={date:toDay(),prodIdx:0,qty:1,channel:S.channels.find(c=>!c.includes('寄賣'))||S.channels[0]};S.forms.sal.prodIdx=parseInt(d.idx);re();}
  else if(a==='selProdC'){if(!S.forms.salC)S.forms.salC={date:toDay(),prodIdx:0,qty:1};S.forms.salC.prodIdx=parseInt(d.idx);re();}
  else if(a==='setExpCat'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:d.v,description:'',amount:'',currency:'TWD',origin:'',payMethod:PAY[0],supplier:'',note:''};S.forms.exp.category=d.v;re();}
  else if(a==='addExpCat'){const nc=prompt('新增類別：');if(nc?.trim()&&!S.expCats.includes(nc.trim())){S.expCats=[...S.expCats,nc.trim()];await saveA('expCats',S.expCats);if(S.forms.exp)S.forms.exp.category=nc.trim();re();}}
  else if(a==='addChannel'){const nc=prompt('新增通路：');if(nc?.trim()&&!S.channels.includes(nc.trim())){S.channels=[...S.channels,nc.trim()];await saveA('channels',S.channels);re();}}
  else if(a==='setPay'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:S.expCats[0],description:'',amount:'',currency:'TWD',origin:'',payMethod:PAY[0],supplier:'',note:''};S.forms.exp.payMethod=d.v;re();}
  else if(a==='editExp'){S.forms['editExp_'+d.id]={...S.exps.find(e=>e.id===d.id)};re();}
  else if(a==='editSal'){S.forms['editSal_'+d.id]={...S.sals.find(s=>s.id===d.id)};re();}

  else if(a==='setEditExpCat'){if(S.forms['editExp_'+d.id])S.forms['editExp_'+d.id].category=d.v;re();}

  else if(a==='openManageItems'){S.modals.manage=true;re();}
  else if(a==='openStocktake'){S.modals.stocktake=true;S.forms.stkPending={};re();}
  else if(a==='openSend'){S.modals.send=true;S.modals.sendStore=d.s||getStores()[0]||'moonstone';S.forms.sendF={date:toDay(),store:d.s||getStores()[0]||'moonstone',prodName:'',qty:'',note:''};re();}
  else if(a==='qkIn'){S.modals.qkStock=true;S.modals.qkData={id:d.id,type:'in'};S.forms.qkF={qty:'',unitCost:'',note:''};re();}
  else if(a==='qkOut'){S.modals.qkStock=true;S.modals.qkData={id:d.id,type:'out'};S.forms.qkF={qty:'',unitCost:'',note:''};re();}
  else if(a==='openProduce'){S.modals.produce=true;S.forms.produceF={prodName:S.prods[0]?.name||'',qty:''};re();}

  else if(a==='askDel'){S.confirms[d.k]=true;re();}

  else if(a==='confirmAddItem')await confirmAddItem();
  else if(a==='confirmSend')  await confirmSend();
  else if(a==='confirmQk')    await confirmQk();

  else if(a==='delExp')       await delRec('exps','e_',d.id,'exps');
  else if(a==='delCustom')    {S.customOrders=(S.customOrders||[]).filter(o=>o.id!==d.id);await saveA('customOrders',S.customOrders);delete S.confirms['co_'+d.id];re();}
  else if(a==='delInvTx')     {const tx=S.invTx.find(t=>t.id===d.id);if(tx&&tx.type==='produce'){await undoProduce(tx);}else if(tx&&tx.type==='send'&&tx.store){if(S.invConsign[tx.store]&&S.invConsign[tx.store][tx.itemName]){S.invConsign[tx.store][tx.itemName]=Math.max(0,(S.invConsign[tx.store][tx.itemName]||0)-tx.qty);await saveO('inv_consign',S.invConsign);}await restoreFinishedStock(tx.itemName,tx.qty);}S.invTx=S.invTx.filter(t=>t.id!==d.id);await saveA('inv_tx',S.invTx);delete S.confirms['tx_'+d.id];re();}
  else if(a==='delItem')      {S.invItems=S.invItems.filter(i=>i.id!==d.id);if(S.photos[d.id]){await delPhoto(d.id);delete S.photos[d.id];}await saveA('inv_items',S.invItems);re();}
  else if(a==='delItemDirect'){if(confirm('確定刪除？'))await act('delItem',d);}
  else if(a==='delItemFromStocktake'){S.invItems=S.invItems.filter(i=>i.id!==d.id);if(S.forms.stkPending)delete S.forms.stkPending[d.id];delete S.confirms['stk_'+d.id];await saveA('inv_items',S.invItems);showToast('✓ 已刪除');re();}
  else if(a==='toggleExpCat'){S.forms.expandedCat=S.forms.expandedCat===d.cat?null:d.cat;re();}
  else if(a==='saveEditExp')  await saveEditExp(d.id);
  else if(a==='saveEditSal')  await saveEditSal(d.id);
  else if(a==='saveInvNames') await saveInvNames();
  else if(a==='doReturn')     await doReturn(d.s,d.n);
  else if(a==='toggleDeposit')await togglePayment(d.id,'deposit');
  else if(a==='toggleBalance')await togglePayment(d.id,'balance');
  else if(a==='setOrderStatus'){const o=(S.customOrders||[]).find(x=>x.id===d.id);if(o){o.status=d.target?.value||d.status;if(o.status==='completed'){o.depositPaid=true;o.balancePaid=true;}await saveA('customOrders',S.customOrders);re();}}
  else if(a==='saveSettings') await saveSettings();
  // Store
  else if(a==='addStoreOpen'){cancelAllAdds();S.forms.showAddStore=true;re();setTimeout(()=>{const el=document.getElementById('newStoreName');if(el)el.focus();},80);}
  else if(a==='addStoreCancel'){S.forms.showAddStore=false;S.forms.newStoreName='';re();}
  else if(a==='addStoreConfirm'){
    const name=(S.forms.newStoreName||'').trim();
    if(!name){showToast('請輸入店名');return;}
    if(!S.settings.consignStores)S.settings.consignStores=[...DEF_STORES];
    if(S.settings.consignStores.includes(name)){showToast('已存在');return;}
    S.settings.consignStores.push(name);
    if(!S.settings.consign)S.settings.consign={...DEF_CONSIGN};
    S.settings.consign[name+' 寄賣']=0.70;
    if(!S.channels.includes(name+' 寄賣'))S.channels.push(name+' 寄賣');
    await saveA('channels',S.channels);await saveO('settings',S.settings);
    S.forms.showAddStore=false;S.forms.newStoreName='';showToast('✓ 已新增 '+name);re();
  }
  // Expense Cat
  else if(a==='addCatOpen'){cancelAllAdds();S.forms.showAddCat=true;re();setTimeout(()=>{const el=document.getElementById('newCatName');if(el)el.focus();},80);}
  else if(a==='addCatCancel'){S.forms.showAddCat=false;S.forms.newCatName='';re();}
  else if(a==='addCatConfirm'){
    const n=(S.forms.newCatName||'').trim();
    if(!n){showToast('請輸入名稱');return;}
    if(S.expCats.includes(n)){showToast('已存在');return;}
    S.expCats.push(n);await saveA('expCats',S.expCats);
    S.forms.showAddCat=false;S.forms.newCatName='';showToast('✓ 已新增');re();
  }
  // Inv Cat
  else if(a==='addInvCatOpen'){cancelAllAdds();S.forms.showAddInvCat=true;re();setTimeout(()=>{const el=document.getElementById('newInvCatName');if(el)el.focus();},80);}
  else if(a==='addInvCatCancel'){S.forms.showAddInvCat=false;S.forms.newInvCatName='';re();}
  else if(a==='addInvCatConfirm'){
    const n=(S.forms.newInvCatName||'').trim();
    if(!n){showToast('請輸入名稱');return;}
    if(!S.settings.invCats)S.settings.invCats=['原料','包材','成品','其他'];
    if(S.settings.invCats.includes(n)){showToast('已存在');return;}
    S.settings.invCats.push(n);await saveO('settings',S.settings);
    S.forms.showAddInvCat=false;S.forms.newInvCatName='';showToast('✓ 已新增');re();
  }
  else if(a==='delInvCat'){
    if(!S.settings.invCats)S.settings.invCats=['原料','包材','成品','其他'];
    const cat=S.settings.invCats[parseInt(d.i)];
    const using=S.invItems.filter(it=>it.cat===cat).length;
    if(using>0){if(!confirm(`「${cat}」有 ${using} 個品項使用中，仍要刪除？這些品項類別會清空。`))return;}
    S.settings.invCats.splice(parseInt(d.i),1);
    await saveO('settings',S.settings);re();
  }
  // Channel
  else if(a==='addChannelOpen'){cancelAllAdds();S.forms.showAddChannel=true;re();setTimeout(()=>{const el=document.getElementById('newChannelName');if(el)el.focus();},80);}
  else if(a==='addChannelCancel'){S.forms.showAddChannel=false;S.forms.newChannelName='';re();}
  else if(a==='addChannelConfirm'){
    const n=(S.forms.newChannelName||'').trim();
    if(!n){showToast('請輸入名稱');return;}
    if(S.channels.includes(n)){showToast('已存在');return;}
    S.channels.push(n);await saveA('channels',S.channels);
    S.forms.showAddChannel=false;S.forms.newChannelName='';showToast('✓ 已新增');re();
  }
  // Currency
  else if(a==='addCurrencyOpen'){cancelAllAdds();S.forms.showAddCurrency=true;S.forms.newCurrencyData={code:'',name:'',rate:'',symbol:''};re();}
  else if(a==='addCurrencyCancel'){S.forms.showAddCurrency=false;S.forms.newCurrencyData=null;re();}
  else if(a==='addCurrencyConfirm'){
    const dt=S.forms.newCurrencyData||{};
    const code=(dt.code||'').toUpperCase().trim();
    const name=(dt.name||'').trim();
    const rate=parseFloat(dt.rate);
    if(!code){showToast('請輸入代碼');return;}
    if(!name){showToast('請輸入名稱');return;}
    if(!rate||rate<=0){showToast('匯率不正確');return;}

  else if(a==='delCurrency'){
    if(!confirm('確定刪除 '+d.code+'？'))return;

  else if(a==='autoBuildRecipe'){

    const prod=S.prods.find(p=>p.name===d.name);
    if(!prod){showToast('找不到產品');return;}
    const find=keyword=>S.invItems.find(i=>i.name.includes(keyword));
    const base=S.invItems.find(i=>i.name.includes('基底擴香液')||i.name.includes('基底'));
    const eo=S.invItems.find(i=>i.name.includes('精油')&&i.unit==='ml');
    const bottle=find('白色噴色擴香瓶')||find('擴香瓶');
    const cap=find('瓶蓋');
    const plug=find('內塞');
    const fiber=find('擴香纖維棒－黑色')||find('纖維棒');
    const sleeve=find('包裝紙套');
    const sticker=find('UV')||find('貼紙');
    const recipe=[];

    if(eo)recipe.push({itemId:eo.id,qty:26});
    if(bottle)recipe.push({itemId:bottle.id,qty:1});
    if(cap)recipe.push({itemId:cap.id,qty:1});
    if(plug)recipe.push({itemId:plug.id,qty:1});
    if(fiber)recipe.push({itemId:fiber.id,qty:6});
    if(sleeve)recipe.push({itemId:sleeve.id,qty:6});

    if(recipe.length===0){showToast('找不到任何材料品項');return;}
    prod.recipe=recipe;

    showToast(`✓ 已建立 ${recipe.length} 項材料的配方`);
    re();

  else if(a==='goSettingsRecipe'){
    delete S.modals.produce;
    S.modals.settings=true;
    S.tab='set';
    re();

  else if(a==='addRecipeRow'){

    re();

  else if(a==='delChannel'){if(confirm('確定刪除「'+S.channels[parseInt(d.i)]+'」？'))await(async()=>{S.channels.splice(parseInt(d.i),1);await saveA('channels',S.channels);re();})();}
  else if(a==='copyRep')      copyRep();

// DRAG & DROP
let _dragId=null;
function initDrag(){
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    const card=handle.closest('.ic');if(!card)return;
    const id=handle.dataset.dragId;
    handle.addEventListener('dragstart',e=>{_dragId=id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    handle.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.ic').forEach(c=>c.classList.remove('drag-over'));});
    card.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.ic').forEach(c=>c.classList.remove('drag-over'));card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',async e=>{
      e.preventDefault();card.classList.remove('drag-over');if(!_dragId||_dragId===id)return;
      const fi=S.invItems.findIndex(i=>i.id===_dragId);const ti=S.invItems.findIndex(i=>i.id===id);
      if(fi<0||ti<0)return;const item=S.invItems.splice(fi,1)[0];S.invItems.splice(ti,0,item);
      await saveA('inv_items',S.invItems);_dragId=null;re();
    });
    let _ti=null,_tc=null;
    handle.addEventListener('touchstart',e=>{_ti=id;handle.closest('.ic').classList.add('dragging');e.preventDefault();},{passive:false});
    handle.addEventListener('touchmove',e=>{e.preventDefault();const y=e.touches[0].clientY;document.querySelectorAll('.ic').forEach(c=>c.classList.remove('drag-over'));document.querySelectorAll('.ic:not(.dragging)').forEach(el=>{const r=el.getBoundingClientRect();if(y>=r.top&&y<=r.bottom){el.classList.add('drag-over');_tc=el;}});},{passive:false});
    handle.addEventListener('touchend',async()=>{
      handle.closest('.ic').classList.remove('dragging');
      if(_tc){_tc.classList.remove('drag-over');const toId=_tc.querySelector('.drag-handle')?.dataset.dragId;
        if(toId&&toId!==_ti){const fi=S.invItems.findIndex(i=>i.id===_ti);const ti=S.invItems.findIndex(i=>i.id===toId);if(fi>=0&&ti>=0){const item=S.invItems.splice(fi,1)[0];S.invItems.splice(ti,0,item);await saveA('inv_items',S.invItems);re();}}}
      _ti=null;_tc=null;
    });
  });
}

// REPORTS
function genMonthRep(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m);const mE=S.exps.filter(e=>mOf(e.date)===m);
  const directRev=mS.filter(s=>!s.channel?.includes('寄賣')).reduce((a,s)=>a+s.subtotal,0);
  const consignRev=mS.filter(s=>s.channel?.includes('寄賣')).reduce((a,s)=>a+s.subtotal,0);
  const customRev=(S.customOrders||[]).reduce((a,o)=>{let r=0;if(o.depositPaid&&mOf(o.depositDate||'')===m)r+=o.depositAmt||0;if(o.balancePaid&&mOf(o.balanceDate||o.depositDate||'')===m)r+=Math.max(0,(o.totalAmt||0)-(o.depositAmt||0));return a+r;},0);
  const totalRev=directRev+consignRev+customRev;const tE=mE.reduce((a,e)=>a+e.amount,0);
  const cogs=mS.reduce((a,s)=>a+(s.cost||0),0);const allPad=S.exps.filter(e=>e.payMethod===PAY[0]).reduce((a,e)=>a+e.amount,0);
  const sugg=Math.max(0,Math.min(totalRev*(1-(S.settings.reserveRate||0.2)),allPad));
  const ML=m?`${m.slice(0,4)}年${parseInt(m.slice(5))}月`:'';const HR='─'.repeat(36);
  return[`◆ OOKO 財務月報 · ${ML}`,HR,`【收入 Revenue】`,`  直售：NT$ ${fmtN(directRev)}`,`  寄賣：NT$ ${fmtN(consignRev)}`,`  客定：NT$ ${fmtN(customRev)}`,`  合計：NT$ ${fmtN(totalRev)}`,'',`【利潤 Profit】`,`  毛利：NT$ ${fmtN(totalRev-cogs)} (${fmtP(totalRev>0?(totalRev-cogs)/totalRev:0)})`,`  淨利：NT$ ${fmtN(totalRev-tE)}`,'',`【公積金 (${fmtP(S.settings.reserveRate)})】`,`  本月提撥：NT$ ${fmtN(totalRev*(S.settings.reserveRate||0.2))}`,'',`【支出分類】`,...S.expCats.map(cat=>{const a=mE.filter(e=>e.category===cat).reduce((r,e)=>r+e.amount,0);return a?`  ${cat}：NT$ ${fmtN(a)}`:null}).filter(Boolean),'',`【還款 Repayment】`,`  累計未還款：NT$ ${fmtN(allPad)}`,`  本月建議還款：NT$ ${fmtN(sugg)}`,HR,`OOKO 財務管理系統 · `+new Date().toLocaleDateString('zh-TW')].join('\n');
}
function genAnnRep(year){
  const yrM=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);const HR='─'.repeat(36);const rows=[`◆ OOKO ${year}年度財務報告`,HR,''];let tR=0,tE=0,tCogs=0;
  yrM.forEach((m,i)=>{const r=S.sals.filter(s=>mOf(s.date)===m).reduce((a,s)=>a+s.subtotal,0);const e=S.exps.filter(x=>mOf(x.date)===m).reduce((a,x)=>a+x.amount,0);const c=S.sals.filter(s=>mOf(s.date)===m).reduce((a,s)=>a+(s.cost||0),0);if(r>0||e>0){rows.push(`${i+1}月：收${fmtN(r)} 支${fmtN(e)} 淨利${fmtN(r-e)}`);tR+=r;tE+=e;tCogs+=c;}});
  rows.push('',HR,`年度總收入：NT$ ${fmtN(tR)}`,`年度毛利　：NT$ ${fmtN(tR-tCogs)} (${fmtP(tR>0?(tR-tCogs)/tR:0)})`,`年度淨利　：NT$ ${fmtN(tR-tE)}`,`年度公積金：NT$ ${fmtN(tR*(S.settings.reserveRate||0.2))}`,HR,'OOKO 財務管理系統');
  return rows.join('\n');
}
function genCSV(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m);const mE=S.exps.filter(e=>mOf(e.date)===m);
  const escCSV=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};
  let c='類型,日期,品項,金額,成本,毛利,毛利率,通路,備註\n';
  mS.forEach(s=>{c+=`銷售,${s.date},${escCSV(s.product)},${s.subtotal},${s.cost||0},${s.profit||0},${s.profitRate?Math.round(s.profitRate*100)+'%':''},${escCSV(s.channel)},${escCSV(s.note||'')}\n`;});
  mE.forEach(e=>{c+=`支出,${e.date},${escCSV(e.description)},${e.amount},,,,${escCSV(e.category)},${escCSV(e.payMethod+(e.supplier?' · '+e.supplier:''))}\n`;});
  (S.customOrders||[]).filter(o=>mOf(o.depositDate||o.date||'')===m).forEach(o=>{c+=`客定款,${o.date},${escCSV(o.customerName+' - '+o.product)},${o.totalAmt},${o.customCost||0},${(o.totalAmt-(o.customCost||0))},,,${escCSV(o.note||'')}\n`;});
  return c;
}

// 多分頁完整月報（CSV 多檔輸出）
// 每個 CSV 對應一個 Excel 分頁
// ════════════════════════════════════════════════
const _escCSV=v=>{const s=String(v??'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};

// Sheet 1: 月度總覽
function genSheet01_Summary(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m);
  const mE=S.exps.filter(e=>mOf(e.date)===m);
  const dr=mS.filter(s=>!s.channel?.includes('寄賣')).reduce((a,s)=>a+s.subtotal,0);
  const cr=mS.filter(s=>s.channel?.includes('寄賣')).reduce((a,s)=>a+s.subtotal,0);
  const cur=(S.customOrders||[]).reduce((a,o)=>{let r=0;if(o.depositPaid&&mOf(o.depositDate||'')===m)r+=o.depositAmt||0;if(o.balancePaid&&mOf(o.balanceDate||o.depositDate||'')===m)r+=Math.max(0,(o.totalAmt||0)-(o.depositAmt||0));return a+r;},0);
  const tR=dr+cr+cur;
  const tE=mE.reduce((a,e)=>a+e.amount,0);
  const cogs=mS.reduce((a,s)=>a+(s.cost||0),0);
  const padM=mE.filter(e=>e.payMethod===PAY[0]).reduce((a,e)=>a+e.amount,0);
  const reserveM=Math.round(tR*(S.settings.reserveRate||0.2));
  let c='OOKO 月度總覽,'+m+'\n\n';
  c+='項目,金額(TWD),說明\n';
  c+=`直售收入,${dr},直接通路銷售\n`;
  c+=`寄賣收入,${cr},寄賣通路實收（已扣店抽）\n`;
  c+=`客定收入,${cur},客定款本月入帳\n`;
  c+=`總收入,${tR},\n`;
  c+=`,,\n`;
  c+=`貨品成本,${cogs},銷售商品 COGS\n`;
  c+=`毛利,${tR-cogs},總收入 - 貨品成本\n`;
  c+=`毛利率,${tR>0?Math.round((tR-cogs)/tR*100)+'%':'0%'},\n`;
  c+=`,,\n`;
  c+=`總支出,${tE},含營運/材料/行銷等\n`;
  c+=`本月個人墊付,${padM},\n`;
  c+=`公積金提撥,${reserveM},${fmtP(S.settings.reserveRate||0.2)}\n`;
  c+=`淨利,${tR-tE},總收入 - 總支出\n`;
  return c;
}

// Sheet 2: 銷售明細
function genSheet02_Sales(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let c='日期,產品,通路,數量,單價,標價金額,實收,成本,毛利,毛利率\n';
  mS.forEach(s=>{
    c+=`${s.date},${_escCSV(s.product)},${_escCSV(s.channel)},${s.qty},${s.price},${s.retail||s.subtotal},${s.subtotal},${s.cost||0},${s.profit||0},${s.profitRate?Math.round(s.profitRate*100)+'%':''}\n`;
  });
  if(mS.length===0)c+='本月無銷售紀錄,,,,,,,,,\n';
  return c;
}

// Sheet 3: 支出明細
function genSheet03_Expenses(m){
  const mE=S.exps.filter(e=>mOf(e.date)===m).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let c='日期,類別,描述,供應商,金額(TWD),原幣,原金額,支付方式\n';
  mE.forEach(e=>{
    c+=`${e.date},${_escCSV(e.category)},${_escCSV(e.description)},${_escCSV(e.supplier||'')},${e.amount},${_escCSV(e.currency||'TWD')},${e.origAmount||e.amount},${_escCSV(e.payMethod||'')}\n`;
  });
  if(mE.length===0)c+='本月無支出紀錄,,,,,,,\n';
  return c;
}

// Sheet 4: 客定款
function genSheet04_Custom(m){
  const orders=(S.customOrders||[]).filter(o=>{
    const d1=mOf(o.depositDate||o.date||'');
    const d2=mOf(o.balanceDate||'');
    return d1===m||d2===m;
  });
  let c='下單日,客戶,產品內容,總金額,成本估算,訂金,訂金已收,尾款已收,實收,毛利,狀態,寄賣店抽成,備註\n';
  orders.forEach(o=>{
    const bal=Math.max(0,(o.totalAmt||0)-(o.depositAmt||0));
    const recv=(o.depositPaid?(o.depositAmt||0):0)+(o.balancePaid?bal:0);
    const actualTotal=o.isConsign?Math.round((o.totalAmt||0)*(parseFloat(o.consignRate)||0.70)):(o.totalAmt||0);
    c+=`${o.date||''},${_escCSV(o.customerName||'')},${_escCSV(o.product||'')},${o.totalAmt||0},${o.customCost||0},${o.depositAmt||0},${o.depositPaid?'是':'否'},${o.balancePaid?'是':'否'},${recv},${actualTotal-(o.customCost||0)},${ORDER_STATUS[o.status]||o.status},${o.isConsign?_escCSV((o.consignStore||'')+' '+fmtP(o.consignRate||0.7)):''},${_escCSV(o.note||'')}\n`;
  });
  if(orders.length===0)c+='本月無客定款紀錄,,,,,,,,,,,,\n';
  return c;
}

// Sheet 5: 產品銷售排行
function genSheet05_ProdRank(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m);
  const byProd=S.prods.map(p=>{
    const ss=mS.filter(s=>s.product.startsWith(p.name));
    const qty=ss.reduce((a,s)=>a+s.qty,0);
    const amt=ss.reduce((a,s)=>a+s.subtotal,0);
    const profit=ss.reduce((a,s)=>a+(s.profit||0),0);
    return{name:p.name,en:p.en||'',price:p.price,level:p.level||1,qty,amt,profit};
  }).filter(x=>x.qty>0).sort((a,b)=>b.amt-a.amt);
  let c='排名,產品名稱,英文名,等級,售價,銷售數量,銷售金額,毛利,毛利率\n';
  byProd.forEach((p,i)=>{
    c+=`${i+1},${_escCSV(p.name)},${_escCSV(p.en)},Lv${p.level},${p.price},${p.qty},${p.amt},${p.profit},${p.amt>0?Math.round(p.profit/p.amt*100)+'%':''}\n`;
  });
  if(byProd.length===0)c+='本月無銷售紀錄,,,,,,,,\n';
  return c;
}

// Sheet 6: 庫存盤點（snapshot）
function genSheet06_InvSnapshot(){
  let c='品項,英文,類別,單位,現有數量,安全庫存,單價(TWD),庫存價值,狀態\n';
  S.invItems.forEach(it=>{
    const value=Math.round((it.qty||0)*(it.unitCost||0));
    const low=it.qty<=it.safe&&it.safe>0;
    c+=`${_escCSV(it.name)},${_escCSV(it.en||'')},${_escCSV(it.cat||'')},${_escCSV(it.unit||'')},${it.qty||0},${it.safe||0},${it.unitCost||0},${value},${low?'⚠ 低庫存':'正常'}\n`;
  });
  if(S.invItems.length===0)c+='無庫存資料,,,,,,,,\n';
  return c;
}

// Sheet 7: 進出貨記錄
function genSheet07_InvTx(m){
  const txs=S.invTx.filter(tx=>mOf(tx.date)===m).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const typeLabels={in:'進貨',out:'出庫',damage:'耗損',send:'送寄賣',return:'退回',adjust:'盤點調整',produce:'製作'};
  let c='日期,類型,品項,數量,單價(TWD),總值,寄賣店,備註\n';
  txs.forEach(tx=>{
    c+=`${tx.date},${typeLabels[tx.type]||tx.type},${_escCSV(tx.itemName||'')},${tx.qty||0},${tx.unitCost||0},${(tx.unitCost||0)*(tx.qty||0)},${_escCSV(tx.store||'')},${_escCSV(tx.note||'')}\n`;
  });
  if(txs.length===0)c+='本月無進出貨紀錄,,,,,,,\n';
  return c;
}

// 一次匯出所有分頁（多個 CSV 檔）
async function exportFullReport(m){
  const sheets=[
    {name:`OOKO_${m}_01_總覽.csv`,content:genSheet01_Summary(m)},
    {name:`OOKO_${m}_02_銷售明細.csv`,content:genSheet02_Sales(m)},
    {name:`OOKO_${m}_03_支出明細.csv`,content:genSheet03_Expenses(m)},
    {name:`OOKO_${m}_04_客定款.csv`,content:genSheet04_Custom(m)},
    {name:`OOKO_${m}_05_產品排行.csv`,content:genSheet05_ProdRank(m)},
    {name:`OOKO_${m}_06_庫存盤點.csv`,content:genSheet06_InvSnapshot()},
    {name:`OOKO_${m}_07_進出貨.csv`,content:genSheet07_InvTx(m)},
  ];
  // 錯開下載避免瀏覽器封鎖
  for(let i=0;i<sheets.length;i++){
    const s=sheets[i];
    setTimeout(()=>dlFile(s.name,s.content,'text/csv'),i*250);
  }
  showToast(`✓ 正在下載 ${sheets.length} 個報表檔 📦`);
}

function genAnnCSV(year){
  const yrM=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  let c='月份,直售,寄賣,客定,總收入,貨品成本,毛利,毛利率,總支出,淨利,公積金\n';
  yrM.forEach(m=>{
    const mS=S.sals.filter(s=>mOf(s.date)===m);
    const dr=mS.filter(s=>!s.channel?.includes('寄賣')).reduce((a,s)=>a+s.subtotal,0);
    const cr=mS.filter(s=>s.channel?.includes('寄賣')).reduce((a,s)=>a+s.subtotal,0);
    const cur=(S.customOrders||[]).reduce((a,o)=>{let r=0;if(o.depositPaid&&mOf(o.depositDate||'')===m)r+=o.depositAmt||0;if(o.balancePaid&&mOf(o.balanceDate||o.depositDate||'')===m)r+=Math.max(0,(o.totalAmt||0)-(o.depositAmt||0));return a+r;},0);
    const r=dr+cr+cur;
    const e=S.exps.filter(x=>mOf(x.date)===m).reduce((a,x)=>a+x.amount,0);
    const cogs=mS.reduce((a,s)=>a+(s.cost||0),0);
    c+=`${parseInt(m.slice(5))}月,${dr},${cr},${cur},${r},${cogs},${r-cogs},${r>0?Math.round((r-cogs)/r*100)+'%':''},${e},${r-e},${Math.round(r*(S.settings.reserveRate||0.2))}\n`;
  });
  return c;
}

function copyText(txt,cb){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(cb).catch(()=>{const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);if(cb)cb();});else{const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);if(cb)cb();}}
function dlFile(name,content,type){
  try{
    // 加上 BOM 讓 Excel 正確顯示中文
    const bom='\uFEFF';
    const finalContent=type==='text/csv'?bom+content:content;
    const b=new Blob([finalContent],{type:type+';charset=utf-8'});
    const url=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  }catch(err){
    // 後備方案：在新視窗開啟
    const w=window.open('','_blank');
    if(w){w.document.write('<pre>'+content.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>');w.document.title=name;}
    else alert('下載失敗：'+err.message);
  }
}
function copyRep(){const m=S.forms.repM||nowM();copyText(genMonthRep(m),()=>{S.forms.copied=true;re();setTimeout(()=>{S.forms.copied=false;re();},2200);});}
function exportJSON(){
  const data={exps:S.exps,sals:S.sals,prods:S.prods,settings:S.settings,invItems:S.invItems,invTx:S.invTx,invConsign:S.invConsign,channels:S.channels,expCats:S.expCats,customOrders:S.customOrders||[],consignSettlements:S.consignSettlements||[],at:new Date().toISOString(),v:'ooko_v7'};
  dlFile(`OOKO_備份_${toDay()}.json`,JSON.stringify(data,null,2),'application/json');showToast('✓ 備份已下載 💾');
}
async function importJSON(file){
  const r=new FileReader();
  r.onload=async e=>{
    try{const d=JSON.parse(e.target.result);if(!d.v||!d.sals){alert('格式不符');return;}if(!confirm(`還原？⚠ 會覆蓋現有資料`))return;
      if(d.exps){S.exps=d.exps;await saveA('exps',S.exps);}S.sals=d.sals;await saveA('sals',S.sals);
      if(d.prods?.length){S.prods=d.prods;await saveA('prods',S.prods);}
      if(d.settings){S.settings={...DEF_SETTINGS,...d.settings};await saveO('settings',S.settings);}
      if(d.invItems?.length){S.invItems=d.invItems;await saveA('inv_items',S.invItems);}
      if(d.invTx){S.invTx=d.invTx;await saveA('inv_tx',S.invTx);}if(d.invConsign){S.invConsign=d.invConsign;await saveO('inv_consign',S.invConsign);}
      if(d.channels?.length){S.channels=d.channels;await saveA('channels',S.channels);}if(d.expCats?.length){S.expCats=d.expCats;await saveA('expCats',S.expCats);}
      if(d.customOrders){S.customOrders=d.customOrders;await saveA('customOrders',S.customOrders);}
      if(d.consignSettlements){S.consignSettlements=d.consignSettlements;await saveA('consignSettlements',S.consignSettlements);}
      delete S.modals.backup;showToast('✓ 備份還原成功 🌸');
    }catch(err){alert('讀取失敗：'+err.message);}
  };r.readAsText(file);
}

async function loadDemo(){
  const tm=nowM();const mkS=(date,p,qty,ch)=>{const rate=cRate(ch);const subtotal=Math.round(p.price*qty*rate);const cost=prodCost(p)*qty;const profit=subtotal-cost;return{id:uid(),date,product:`${p.name} ${p.en||''}`.trim(),price:p.price,qty,subtotal,retail:p.price*qty,channel:ch,cost,profit,profitRate:subtotal>0?profit/subtotal:0};};
  S.sals=[mkS(tm+'-03',S.prods[0],2,'Instagram 直售'),mkS(tm+'-07',S.prods[3],1,'moonstone 寄賣'),mkS(tm+'-12',S.prods[8],2,'jiang space 寄賣'),mkS(tm+'-18',S.prods[11],1,'市集現場')];
  S.exps=[{id:uid(),date:tm+'-02',category:'材料',description:'薰衣草精油 50ml×3',amount:1800,payMethod:PAY[0],supplier:'淘寶',note:''},{id:uid(),date:tm+'-08',category:'行銷',description:'Instagram 推廣',amount:500,payMethod:PAY[1],supplier:'',note:''}];
  await saveA('sals',S.sals);await saveA('exps',S.exps);showToast('✦ 示範資料已載入 ✨');
}

// INIT
async function init(){
  const[exps,sals,prods,settings,invItems,invTx,invConsign,channels,expCats,customOrders,consignSettlements]=await Promise.all([
    loadA('exps'),loadA('sals'),loadA('prods'),loadO('settings',DEF_SETTINGS),
    loadA('inv_items'),loadA('inv_tx'),loadO('inv_consign',{}),
    loadA('channels'),loadA('expCats'),loadA('customOrders'),loadA('consignSettlements'),
  ]);
  S.exps=exps;S.sals=sals;
  if(prods?.length)S.prods=prods;
  S.settings={...DEF_SETTINGS,...settings};
  if(invItems?.length)S.invItems=invItems;
  if(invTx)S.invTx=invTx;if(invConsign)S.invConsign=invConsign;
  if(channels?.length)S.channels=channels;if(expCats?.length)S.expCats=expCats;
  if(customOrders)S.customOrders=customOrders;
  if(consignSettlements)S.consignSettlements=consignSettlements;
  S.forms={salOpen:true,salCOpen:true,expOpen:true,invTxOpen:true,customOpen:true};
  // 載入所有品項照片
  await Promise.all(S.invItems.map(async item=>{
    const p=await loadPhoto(item.id);
    if(p)S.photos[item.id]=p;
  }));
  render();
}
init();
