function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error)})}
async function dbG(k){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>r2(r.result??null);r.onerror=()=>rj(r.error)})}catch{return null}}
async function dbS(k,v){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>r2(true);r.onerror=()=>rj(r.error)})}catch{return false}}
async function loadA(k){try{const r=await dbG(k);return r?JSON.parse(r):[]}catch{return[]}}
async function loadO(k,d){try{const r=await dbG(k);return r?JSON.parse(r):d}catch{return d}}
async function saveA(k,d){await dbS(k,JSON.stringify(d))}
async function saveO(k,d){await dbS(k,JSON.stringify(d))}

function findProdInvItem(prodName){
  return S.invItems.find(i=>i.cat==='成品'&&i.name===prodName);
}

async function deductFinishedStock(prodName,qty){
  const item=findProdInvItem(prodName);
  if(!item){return{ok:false,msg:'找不到成品庫存「'+prodName+'」'};}
  const before=item.qty;
  item.qty=Math.max(0,item.qty-qty);
  await saveA('inv_items',S.invItems);
  if(before<qty)return{ok:true,warn:true,msg:'⚠ 庫存不足！「'+prodName+'」只有 '+before+' 瓶，已扣為 0'};
  return{ok:true,warn:false};
}
async function restoreFinishedStock(prodName,qty){
  const item=findProdInvItem(prodName);
  if(!item)return false;
  item.qty+=qty;
  await saveA('inv_items',S.invItems);
  return true;
}
