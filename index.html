// ── IndexedDB ────────────────────────────────
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ooko6',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error)})}
async function dbG(k){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>r2(r.result??null);r.onerror=()=>rj(r.error)})}catch{return null}}
async function dbS(k,v){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>r2(true);r.onerror=()=>rj(r.error)})}catch{return false}}
async function loadA(k){try{const r=await dbG(k);return r?JSON.parse(r):[]}catch{return[]}}
async function loadO(k,d){try{const r=await dbG(k);return r?JSON.parse(r):d}catch{return d}}
async function saveA(k,d){try{await dbS(k,JSON.stringify(d))}catch{}}
async function saveO(k,d){try{await dbS(k,JSON.stringify(d))}catch{}}

// ── Consignment Reconciliation 寄賣對帳 ──────
function salConsign(){
  const sel=S.forms.consignStore||'moonstone';
  const freq=S.settings.consignFreq||'monthly';
  const period=S.forms.consignPeriod||getCurrentPeriod(freq);
  const allPeriods=[...new Set(S.sals.filter(s=>s.channel===sel+' 寄賣').map(s=>{
    if(freq==='quarterly'){const q=Math.ceil(parseInt(s.date.slice(5,7))/3);return s.date.slice(0,4)+'-Q'+q;}
    return s.date.slice(0,7);
  }))].sort().reverse();
  if(!allPeriods.includes(getCurrentPeriod(freq)))allPeriods.unshift(getCurrentPeriod(freq));
  const periodSales=getPeriodSales(sel,period,freq,S.sals);
  const consignRate=(S.settings.consign||CONSIGN_DEF)[sel+' 寄賣']||0.70;
  const retailTotal=periodSales.reduce((a,s)=>a+(s.retail||s.subtotal),0);
  const expectedAmt=periodSales.reduce((a,s)=>a+s.subtotal,0);
  const settlement=S.consignSettlements.find(st=>st.store===sel&&st.period===period);
  const receivedAmt=settlement?.receivedAmt||0;
  const outstanding=expectedAmt-receivedAmt;
  const deliveries=S.invTx.filter(tx=>tx.type==='send'&&tx.store===sel);
  const periodDeliveries=deliveries.filter(d=>{
    if(freq==='quarterly'){const q=Math.ceil(parseInt(d.date.slice(5,7))/3);return d.date.slice(0,4)+'-Q'+q===period;}
    return d.date.slice(0,7)===period;
  });
  const storeStock=S.invConsign[sel]||{};
  const totalStock=Object.values(storeStock).reduce((a,v)=>a+(v||0),0);
  return`
<div style="display:flex;gap:8px;margin-bottom:12px">
  ${STORES.map(s=>`<button class="btn ${sel===s?'bc':'bo'}" style="flex:1;font-size:13px;padding:11px;font-weight:700" data-a="setConsignStore" data-v="${s}">${esc(s)}</button>`).join('')}
</div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
  <select class="inp" style="flex:1" data-b="consignPeriod">
    ${allPeriods.map(p=>`<option value="${p}"${period===p?' selected':''}>${getPeriodLabel(p,freq)}</option>`).join('')}
  </select>
  <select class="inp" style="width:110px" data-b="consignFreq">
    <option value="monthly"${freq==='monthly'?' selected':''}>每月</option>
    <option value="quarterly"${freq==='quarterly'?' selected':''}>每季</option>
  </select>
</div>
<div class="card" style="background:linear-gradient(135deg,var(--coralL),var(--bubbleL));border-color:var(--coralM);margin-bottom:10px">
  <div style="font-size:11px;font-weight:700;color:var(--coral);margin-bottom:10px">${esc(sel)} · ${getPeriodLabel(period,freq)} 對帳</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
    <div style="background:rgba(255,255,255,.7);border-radius:10px;padding:10px">
      <div style="font-size:10px;color:var(--muted);font-weight:700">賣出瓶數</div>
      <div style="font-size:22px;font-weight:800;color:var(--coral)">${periodSales.reduce((a,s)=>a+s.qty,0)}<span style="font-size:11px;color:var(--muted)">瓶</span></div>
    </div>
    <div style="background:rgba(255,255,255,.7);border-radius:10px;padding:10px">
      <div style="font-size:10px;color:var(--muted);font-weight:700">標價總計</div>
      <div style="font-size:22px;font-weight:800;color:var(--ink)">${fmt(retailTotal)}</div>
    </div>
  </div>
  <div style="background:rgba(255,255,255,.7);border-radius:10px;padding:12px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:12px;color:var(--muted);font-weight:700">應收金額（你拿 ${fmtP(consignRate)}）</span>
      <span style="font-size:16px;font-weight:800;color:var(--green)">${fmt(expectedAmt)}</span>

    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:12px;color:var(--muted);font-weight:700">已收金額 Received</span>
      <span style="font-size:16px;font-weight:800;color:${receivedAmt>0?'var(--mint)':'var(--muted)'}">${fmt(receivedAmt)}</span>
    </div>
    <div style="height:1px;background:var(--bd);margin:8px 0"></div>
    <div style="display:flex;justify-content:space-between">
      <span style="font-size:12px;font-weight:800;color:${outstanding>0?'var(--amber)':'var(--green)'}">${outstanding>0?'⚠ 尚未收款':'✓ 已全數收款'}</span>

  ${settlement?.settled?`<div style="background:var(--greenBg);border:2px solid var(--greenBd);border-radius:10px;padding:10px;font-size:12px;color:var(--green);font-weight:700">✓ 已對帳完成 ${esc(settlement.settledDate||'')} · 收款 ${fmt(settlement.receivedAmt)}</div>`:`
  <div style="display:flex;gap:8px;align-items:center">
    <input class="inp" type="number" placeholder="輸入實際收款金額..." value="${settlement?.receivedAmt||''}" data-b="consignRecv" style="flex:1">
    <button class="btn bc" style="width:auto;padding:11px 16px;font-size:13px;white-space:nowrap" data-a="markSettled" data-store="${esc(sel)}" data-period="${esc(period)}">記錄收款 ✓</button>

</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">

  <button class="btn bc" style="height:auto;font-size:12px;padding:10px" data-a="openSend" data-s="${esc(sel)}">＋ 送貨到店 Deliver</button>
</div>
${periodDeliveries.length?`<div class="card">
  <div class="sec">本期送貨記錄 <span>Deliveries This Period</span></div>
  ${periodDeliveries.map(d=>`<div class="rr"><span class="rl">📦 ${esc(d.date)} · ${esc(d.itemName)}</span><span class="rv">+${d.qty}瓶</span></div>`).join('')}
</div>`:''}
${periodSales.length?`<div class="card">
  <div class="sec">本期銷售明細 <span>Sales This Period</span></div>
  ${periodSales.map(s=>`<div class="rr"><span class="rl">${esc(s.date)} · ${esc(s.product)} ×${s.qty}</span><span class="rv" style="color:var(--green)">${fmt(s.subtotal)}</span></div>`).join('')}
  <div class="rr" style="border:none"><span class="rl" style="font-weight:700">合計</span><span class="rv" style="color:var(--green);font-size:16px">${fmt(expectedAmt)}</span></div>
</div>`:`<div class="empty" style="padding:20px"><div class="ei" style="font-size:24px">🏪</div>本期尚無 ${esc(sel)} 寄賣紀錄</div>`}
<div style="margin-top:8px">
  <div class="lh">所有對帳記錄 <span style="font-size:9px">Settlement History</span><div class="ll"></div></div>
  ${S.consignSettlements.filter(st=>st.store===sel).length===0?`<div style="font-size:12px;color:var(--muted);padding:10px 0">尚無對帳記錄</div>`:''}
  ${S.consignSettlements.filter(st=>st.store===sel).sort((a,b)=>b.period.localeCompare(a.period)).map(st=>`<div class="rr">
    <span class="rl">${getPeriodLabel(st.period,freq)} ${st.settled?'✓':''}</span>
    <div style="text-align:right"><div class="rv" style="color:var(--green)">${fmt(st.receivedAmt)}</div><div style="font-size:10px;color:var(--muted)">${st.settledDate||''}</div></div>
  </div>`).join('')}
</div>`;
}

function repPage(){
  const months=[...new Set([...S.sals.map(s=>mOf(s.date)),...S.exps.map(e=>mOf(e.date)),nowM()])].filter(Boolean).sort().reverse();
  const m=S.forms.repM||months[0]||nowM();
  const rv=S.forms.repV||'monthly';
  const year=S.forms.repY||new Date().getFullYear().toString();
  const mS=S.sals.filter(s=>mOf(s.date)===m);
  const mE=S.exps.filter(e=>mOf(e.date)===m);
  const rev=mS.reduce((a,s)=>a+s.subtotal,0);
  const tE=mE.reduce((a,e)=>a+e.amount,0);
  const cogs=mS.reduce((a,s)=>a+(s.cost||0),0);
  const gross=rev-cogs;
  const net=rev-tE;
  const res=rev*S.settings.reserveRate;
  const pad=mE.filter(e=>e.payMethod===PAY[0]).reduce((a,e)=>a+e.amount,0);
  const brand=mE.filter(e=>e.payMethod===PAY[1]).reduce((a,e)=>a+e.amount,0);
  const allPad=S.exps.filter(e=>e.payMethod===PAY[0]).reduce((a,e)=>a+e.amount,0);
  const sugg=Math.max(0,Math.min(rev*(1-S.settings.reserveRate),allPad));
  const retail=mS.reduce((a,s)=>a+(s.retail||s.subtotal),0);
  const loss=retail-rev;
  const grossRate=rev>0?gross/rev:0;
  const byCat=S.expCats.map(c=>({c,a:mE.filter(e=>e.category===c).reduce((a,e)=>a+e.amount,0)})).filter(x=>x.a>0);
  const byProd=S.prods.map(p=>({
    name:p.name,en:p.en,
    qty:mS.filter(s=>s.product.startsWith(p.name)).reduce((a,s)=>a+s.qty,0),
    amt:mS.filter(s=>s.product.startsWith(p.name)).reduce((a,s)=>a+s.subtotal,0),
    profit:mS.filter(s=>s.product.startsWith(p.name)).reduce((a,s)=>a+(s.profit||0),0),
  })).filter(x=>x.qty>0).sort((a,b)=>b.amt-a.amt);
  const yrM=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  const yrR=yrM.map(mo=>S.sals.filter(s=>mOf(s.date)===mo).reduce((a,s)=>a+s.subtotal,0));
  const yrE=yrM.map(mo=>S.exps.filter(e=>mOf(e.date)===mo).reduce((a,e)=>a+e.amount,0));
  const yrN=yrR.map((r,i)=>r-yrE[i]);
  const tR=yrR.reduce((a,v)=>a+v,0),tEy=yrE.reduce((a,v)=>a+v,0);
  const maxY=Math.max(...yrR,1);
  const copied=S.forms.copied;

  // Pricing tool
  const ptProd=S.prods[S.forms.ptIdx||0];
  const ptCost=ptProd?prodCost(ptProd):0;
  const ptMargin=S.settings.targetMargin||0.50;
  const ptSuggest=suggestPrice(ptCost,ptMargin);

  return`

  ${[{id:'monthly',zh:'月報'},{id:'annual',zh:'年報'},{id:'pricing',zh:'定價工具'}].map(t=>`<button class="btn ${rv===t.id?'bc':'bo'}" style="flex:1;font-size:12px;padding:10px;font-weight:700" data-a="setRepV" data-v="${t.id}">${t.zh}</button>`).join('')}
</div>
${rv==='monthly'?`
<div class="f"><label>選擇月份</label><select class="inp" data-b="repM">${months.map(mo=>`<option value="${mo}"${m===mo?' selected':''}>${mo.slice(0,4)}年${parseInt(mo.slice(5))}月</option>`).join('')}</select></div>
<div class="g2" style="margin-bottom:12px">
  <div class="kpi" style="background:var(--coralL);border-color:var(--coralM)"><div class="kpi-zh">本月實收</div><div class="kpi-en">Revenue</div><div class="kpi-v" style="color:var(--coral)">${fmt(rev)}</div></div>
  <div class="kpi" style="background:var(--bdL)"><div class="kpi-zh">本月支出</div><div class="kpi-en">Expense</div><div class="kpi-v" style="color:var(--sub)">${fmt(tE)}</div></div>
  <div class="kpi" style="background:${grossRate>=ptMargin?'var(--mintL)':'var(--coralL)'};border-color:${grossRate>=ptMargin?'var(--mintM)':'var(--coralM)'}">

function renderModals(){
  let h='';
  if(S.modals.backup)   h+=backupModal();
  if(S.modals.settings) h+=settingsModal();
  if(S.modals.addItem)  h+=addItemModal();
  if(S.modals.manage)   h+=manageModal();
  if(S.modals.stocktake) h+=stocktakeModal();
  if(S.modals.send)     h+=sendModal();
  if(S.modals.qkStock)  h+=quickModal();
  if(S.modals.repTxt)   h+=repTxtModal();
  return h;
}

function genMonthRep(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m);
  const mE=S.exps.filter(e=>mOf(e.date)===m);
  const rev=mS.reduce((a,s)=>a+s.subtotal,0);
  const tE=mE.reduce((a,e)=>a+e.amount,0);
  const cogs=mS.reduce((a,s)=>a+(s.cost||0),0);
  const gross=rev-cogs;
  const net=rev-tE;
  const res=rev*S.settings.reserveRate;
  const pad=mE.filter(e=>e.payMethod===PAY[0]).reduce((a,e)=>a+e.amount,0);
  const allPad=S.exps.filter(e=>e.payMethod===PAY[0]).reduce((a,e)=>a+e.amount,0);
  const sugg=Math.max(0,Math.min(rev*(1-S.settings.reserveRate),allPad));
  const ML=m?`${m.slice(0,4)}年${parseInt(m.slice(5))}月`:'';
  const HR='─'.repeat(34);
  return[`◆ OOKO 財務月報 · ${ML}`,HR,
    '【營收與利潤】',
    `  實收：NT$ ${fmtN(rev)}`,`  貨品成本(COGS)：NT$ ${fmtN(cogs)}`,
    `  毛利：NT$ ${fmtN(gross)} (${fmtP(rev>0?gross/rev:0)})`,
    `  淨利（扣全支出）：NT$ ${fmtN(net)}`,'',
    `【公積金 (${fmtP(S.settings.reserveRate)})】`,`  本月提撥：NT$ ${fmtN(res)}`,'',
    '【支出分類】',
    ...S.expCats.map(c=>{const a=mE.filter(e=>e.category===c).reduce((r,e)=>r+e.amount,0);return a?`  ${c}：NT$ ${fmtN(a)}`:null}).filter(Boolean),
    `  個人墊付：NT$ ${fmtN(pad)}`,'',
    '【通路】',
    ...S.channels.map(ch=>{const a=mS.filter(s=>s.channel===ch).reduce((r,s)=>r+s.subtotal,0);return a?`  ${ch}：NT$ ${fmtN(a)}`:null}).filter(Boolean),'',
    '【還款】',`  累計未還款：NT$ ${fmtN(allPad)}`,`  本月建議還款：NT$ ${fmtN(sugg)}`,
    HR,'由 OOKO 財務管理系統產生 · '+new Date().toLocaleDateString('zh-TW'),
  ].join('\n');
}
function genAnnRep(year){
  const yrM=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  const HR='─'.repeat(34);const rows=[`◆ OOKO ${year}年度財務報告`,HR,''];
  let tR=0,tE=0,tCogs=0;
  yrM.forEach((m,i)=>{
    const r=S.sals.filter(s=>mOf(s.date)===m).reduce((a,s)=>a+s.subtotal,0);
    const e=S.exps.filter(x=>mOf(x.date)===m).reduce((a,x)=>a+x.amount,0);
    const cogs=S.sals.filter(s=>mOf(s.date)===m).reduce((a,s)=>a+(s.cost||0),0);
    if(r>0||e>0){rows.push(`${i+1}月：收${fmtN(r)} 支${fmtN(e)} 毛利${fmtN(r-cogs)} 淨利${fmtN(r-e)}`);tR+=r;tE+=e;tCogs+=cogs;}
  });
  rows.push('',HR,`年度總收入：NT$ ${fmtN(tR)}`,`年度總支出：NT$ ${fmtN(tE)}`,`年度毛利　：NT$ ${fmtN(tR-tCogs)} (${fmtP(tR>0?(tR-tCogs)/tR:0)})`,`年度淨利　：NT$ ${fmtN(tR-tE)}`,`年度公積金：NT$ ${fmtN(tR*S.settings.reserveRate)}`,HR,'由 OOKO 財務管理系統產生');
  return rows.join('\n');
}
function genCSV(m){
  const mS=S.sals.filter(s=>mOf(s.date)===m);
  const mE=S.exps.filter(e=>mOf(e.date)===m);
  let c='類型,日期,品項,實收金額,成本,毛利,毛利率,通路/類別,支付方式\n';
  mS.forEach(s=>c+=`銷售,${s.date},"${s.product}",${s.subtotal},${s.cost||0},${s.profit||0},${s.profitRate?Math.round(s.profitRate*100)+'%':''},"${s.channel}",\n`);
  mE.forEach(e=>c+=`支出,${e.date},"${e.description}",${e.amount},,,,,"${e.category}","${e.payMethod}"\n`);
  return c;
}
function genAnnCSV(year){
  const yrM=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  let c='月份,總收入,貨品成本,毛利,毛利率,總支出,淨利,公積金\n';
  yrM.forEach(m=>{
    const r=S.sals.filter(s=>mOf(s.date)===m).reduce((a,s)=>a+s.subtotal,0);
    const e=S.exps.filter(x=>mOf(x.date)===m).reduce((a,x)=>a+x.amount,0);
    const cogs=S.sals.filter(s=>mOf(s.date)===m).reduce((a,s)=>a+(s.cost||0),0);
    c+=`${parseInt(m.slice(5))}月,${r},${cogs},${r-cogs},${r>0?Math.round((r-cogs)/r*100)+'%':''},${e},${r-e},${Math.round(r*S.settings.reserveRate)}\n`;
  });
  return c;
}

function bind(path,val){
  const p=path.split('.');
  if(p[0]==='sal'){if(!S.forms.sal)S.forms.sal={date:toDay(),prodIdx:0,qty:1,channel:S.channels[0]};S.forms.sal[p[1]]=val;if(p[1]==='channel'||p[1]==='qty'||p[1]==='prodIdx')re();}
  else if(p[0]==='exp'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:S.expCats[0],description:'',amount:'',payMethod:PAY[0],currency:'TWD',origin:'',note:''};S.forms.exp[p[1]]=val;if(p[1]==='currency'||p[1]==='amount')re();}
  else if(p[0]==='invF'){if(!S.forms.invF)S.forms.invF={date:toDay(),itemId:'',type:'in',qty:'',unitCost:'',currency:'TWD',store:'',note:''};S.forms.invF[p[1]]=val;if(p[1]==='type'||p[1]==='currency'||p[1]==='unitCost')re();}
  else if(p[0]==='newItem'){if(!S.forms.newItem)S.forms.newItem={name:'',en:'',cat:'包材',unit:'個',qty:0,safe:10,unitCost:0};S.forms.newItem[p[1]]=val;}
  else if(p[0]==='invItem'&&p.length===3){
    const idx2=parseInt(p[1]);
    if(S.invItems[idx2]){S.invItems[idx2][p[2]]=p[2]==='safe'?parseInt(val)||0:val;}
  }
  else if(p[0]==='sendF'){if(!S.forms.sendF)S.forms.sendF={store:'moonstone',prodName:'',qty:'',note:''};S.forms.sendF[p[1]]=val;}
  else if(p[0]==='qkF'){if(!S.forms.qkF)S.forms.qkF={qty:'',unitCost:'',note:''};S.forms.qkF[p[1]]=val;}
  else if(p[0]==='customF'){if(!S.forms.customF)S.forms.customF={date:toDay(),customerName:'',product:'',totalAmt:'',depositAmt:'',depositDate:toDay(),balanceDate:'',status:'pending',note:''};S.forms.customF[p[1]]=val;}
  else if(p[0]==='editExp'){if(S.forms['editExp_'+p[1]])S.forms['editExp_'+p[1]][p[2]]=val;}
  else if(p[0]==='editSal'){if(S.forms['editSal_'+p[1]])S.forms['editSal_'+p[1]][p[2]]=val;}
  else if(p[0]==='consignPeriod'){S.forms.consignPeriod=val;re();}
  else if(p[0]==='consignFreq'){S.settings.consignFreq=val;saveO('settings',S.settings);re();}
  else if(p[0]==='consignRecv'){S.forms.consignRecvAmt=val;}
  else if(p[0]==='repM'){S.forms.repM=val;re();}
  else if(p[0]==='repY'){S.forms.repY=val;re();}
  else if(p[0]==='ptIdx'){S.forms.ptIdx=parseInt(val);re();}
  else if(p[0]==='currency'){
    const idx=(S.settings.currencies||DEFAULT_SETTINGS.currencies).findIndex(c=>c.code===p[1]);
    if(idx>=0)S.settings.currencies[idx].rate=parseFloat(val)||1;
  }
  else if(p[0]==='settings'){
    if(p[1]==='reserveRate'||p[1]==='salaryAmt'||p[1]==='baseCost'||p[1]==='targetMargin')S.settings[p[1]]=parseFloat(val)||0;
    else if(p[1]==='consignFreq'){S.settings.consignFreq=val;}
    else if(p[1]==='mlBase'){if(!S.settings.mlPerBottle)S.settings.mlPerBottle={base:150,eo:22.5};S.settings.mlPerBottle.base=parseFloat(val)||150;}
    else if(p[1]==='mlEO'){if(!S.settings.mlPerBottle)S.settings.mlPerBottle={base:150,eo:22.5};S.settings.mlPerBottle.eo=parseFloat(val)||22.5;}
    else if(p[1]==='consign'){if(!S.settings.consign)S.settings.consign={...CONSIGN_DEF};if(p[2]==='ms')S.settings.consign['moonstone 寄賣']=parseFloat(val)||0.70;if(p[2]==='js')S.settings.consign['jiang space 寄賣']=parseFloat(val)||0.80;}
  }
  else if(p[0]==='prod'&&p.length===3){const i=parseInt(p[1]);if(S.prods[i])S.prods[i][p[2]]=p[2]==='price'||p[2]==='eoC'?parseFloat(val)||0:val;}
}

async function act(a,d){
  if(a==='openBackup'){S.modals.backup=true;re();}
  else if(a==='openSettings'){S.modals.settings=true;re();}
  else if(a==='closeM'){delete S.modals[d.m];re();}
  else if(a==='goInv'){S.tab='inv';re();}
  else if(a==='toggleSalForm'){S.forms.salOpen=!(S.forms.salOpen!==false);re();}
  else if(a==='toggleExpForm'){S.forms.expOpen=!(S.forms.expOpen!==false);re();}
  else if(a==='selProd'){if(!S.forms.sal)S.forms.sal={date:toDay(),prodIdx:0,qty:1,channel:S.channels[0]};S.forms.sal.prodIdx=parseInt(d.idx);re();}
  else if(a==='setPay'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:S.expCats[0],description:'',amount:'',payMethod:PAY[0],note:''};S.forms.exp.payMethod=d.v;re();}
  else if(a==='setExpCat'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:d.v,description:'',amount:'',payMethod:PAY[0],note:''};S.forms.exp.category=d.v;re();}
  else if(a==='addExpCat'){const nc=prompt('新增支出類別：');if(nc?.trim()&&!S.expCats.includes(nc.trim())){S.expCats=[...S.expCats,nc.trim()];await saveA('expCats',S.expCats);if(S.forms.exp)S.forms.exp.category=nc.trim();re();}}
  else if(a==='addChannel'){const nc=prompt('新增入帳管道：');if(nc?.trim()&&!S.channels.includes(nc.trim())){S.channels=[...S.channels,nc.trim()];await saveA('channels',S.channels);re();}}
  else if(a==='setInvV'){S.forms.invV=d.v;re();}
  else if(a==='setInvCat'){S.forms.invCat=d.v;re();}
  else if(a==='setStoreV'){S.forms.storeV=d.v;re();}
  else if(a==='setRepV'){S.forms.repV=d.v;re();}
  else if(a==='toggleInvTx'){S.forms.invTxOpen=!(S.forms.invTxOpen!==false);re();}
  else if(a==='openAddItem'){S.modals.addItem=true;S.forms.newItem={name:'',en:'',cat:'包材',unit:'個',qty:0,safe:10,unitCost:0};re();}
  else if(a==='openManageItems'){S.modals.manage=true;re();}
  else if(a==='openStocktake'){S.modals.stocktake=true;re();}

async function submitSal(){
  const f=S.forms.sal||{};
  const prod=S.prods[f.prodIdx||0];
  if(!prod){showToast('請選擇產品');return;}
  const qty=parseInt(f.qty);
  if(!qty||qty<=0){showToast('請填寫數量');return;}
  const price=prod.price;
  const retail=price*qty;
  const consign=S.settings.consign||CONSIGN_DEF;
  const rate=consign[f.channel];
  const subtotal=Math.round(retail*(rate||1));
  const cost=prodCost(prod)*qty;
  const profit=subtotal-cost;
  const profitRate2=subtotal>0?profit/subtotal:0;
  const rec={id:uid(),date:f.date||toDay(),product:`${prod.name} ${prod.en||''}`.trim(),price,qty,subtotal,retail,channel:f.channel||S.channels[0],cost,profit,profitRate:profitRate2};
  if(CONSIGN_DEF[rec.channel]){
    const sk=rec.channel==='moonstone 寄賣'?'moonstone':'jiang space';
    if(!S.invConsign[sk])S.invConsign[sk]={};
    const n=prod.name;
    if(S.invConsign[sk][n]!=null)S.invConsign[sk][n]=Math.max(0,(S.invConsign[sk][n]||0)-qty);
    await saveO('inv_consign',S.invConsign);
  }
  S.sals=[rec,...S.sals];
  await saveA('sals',S.sals);
  S.forms.sal={...S.forms.sal,qty:1};
  showToast(`✓ 銷售記錄！毛利 ${fmt(profit)} (${fmtP(profitRate2)}) 🌸`);
}

async function submitInvTx(){
  const f=S.forms.invF||{};
  if(!f.itemId){showToast('請選擇品項');return;}
  if(!f.qty||parseInt(f.qty)<=0){showToast('請填寫數量');return;}
  const item=S.invItems.find(i=>i.id===f.itemId);
  if(!item)return;
  const qty=parseInt(f.qty);
  const rawUC2=parseFloat(f.unitCost)||0;const twdUC=toTWD(rawUC2,f.currency||'TWD');
  const tx={id:uid(),date:f.date||toDay(),itemId:f.itemId,itemName:item.name,type:f.type||'in',qty,unitCost:twdUC,origUnitCost:f.currency&&f.currency!=='TWD'?rawUC2:null,unitCostCurrency:f.currency||'TWD',store:f.store||'',note:f.note||''};
  if(f.type==='in'||f.type==='return') item.qty+=qty;
  else if(f.type==='out'||f.type==='send'||f.type==='damage') item.qty=Math.max(0,item.qty-qty);
  else if(f.type==='adjust') item.qty=qty;
  if(f.unitCost&&f.type==='in'){const rawUC=parseFloat(f.unitCost);item.unitCost=toTWD(rawUC,f.currency||'TWD');item.origUnitCost=f.currency&&f.currency!=='TWD'?rawUC:null;item.unitCostCurrency=f.currency||'TWD';}
  if(f.type==='send'&&f.store){if(!S.invConsign[f.store])S.invConsign[f.store]={};S.invConsign[f.store][item.name]=(S.invConsign[f.store][item.name]||0)+qty;await saveO('inv_consign',S.invConsign);}
  if(f.type==='return'&&f.store&&S.invConsign[f.store]){S.invConsign[f.store][item.name]=Math.max(0,(S.invConsign[f.store][item.name]||0)-qty);await saveO('inv_consign',S.invConsign);}
  S.invTx=[tx,...S.invTx];
  await saveA('inv_tx',S.invTx);
  await saveA('inv_items',S.invItems);
  S.forms.invF={...S.forms.invF,qty:'',note:'',unitCost:''};
  showToast('✓ 進出貨已記錄');
}

async function confirmStocktake(){
  const inputs=document.querySelectorAll('[data-stk]');
  let changed=0;
  const txs=[];
  inputs.forEach(el=>{
    const id=el.dataset.stk;
    const item=S.invItems.find(i=>i.id===id);
    if(!item)return;
    const newQty=parseInt(el.value);
    if(isNaN(newQty)||newQty<0)return;
    if(newQty!==item.qty){
      txs.push({id:uid(),date:toDay(),itemId:id,itemName:item.name,type:'adjust',qty:newQty,unitCost:0,store:'',note:'盤點初始化'});
      item.qty=newQty;
      changed++;
    }
  });
  if(changed===0){showToast('沒有變更');return;}
  S.invTx=[...txs,...S.invTx];
  await saveA('inv_items',S.invItems);
  await saveA('inv_tx',S.invTx);
  delete S.modals.stocktake;
  showToast(`✓ 已更新 ${changed} 個品項的庫存 📦`);
}

// ── Drag and Drop for Inventory ──────────────
let _dragId=null;
function initInvDrag(){
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    const card=handle.closest('.ic');
    if(!card)return;
    const id=handle.dataset.dragId;
    handle.addEventListener('dragstart',e=>{
      _dragId=id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    handle.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      document.querySelectorAll('.ic').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      document.querySelectorAll('.ic').forEach(c=>c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',async e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      if(!_dragId||_dragId===id)return;
      const fromIdx=S.invItems.findIndex(i=>i.id===_dragId);
      const toIdx=S.invItems.findIndex(i=>i.id===id);
      if(fromIdx<0||toIdx<0)return;
      const item=S.invItems.splice(fromIdx,1)[0];
      S.invItems.splice(toIdx,0,item);
      await saveA('inv_items',S.invItems);
      _dragId=null;re();
    });
  });
  // Touch drag support for mobile
  let _touchItem=null,_touchStartY=0,_touchClone=null;
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    const id=handle.dataset.dragId;
    handle.addEventListener('touchstart',e=>{
      _touchItem=id;
      _touchStartY=e.touches[0].clientY;
      handle.closest('.ic').classList.add('dragging');
      e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchmove',e=>{
      e.preventDefault();
      const y=e.touches[0].clientY;
      const els=document.querySelectorAll('.ic:not(.dragging)');
      document.querySelectorAll('.ic').forEach(c=>c.classList.remove('drag-over'));
      els.forEach(el=>{
        const r=el.getBoundingClientRect();
        if(y>=r.top&&y<=r.bottom)el.classList.add('drag-over');
      });
    },{passive:false});
    handle.addEventListener('touchend',async e=>{
      const card=handle.closest('.ic');
      card.classList.remove('dragging');
      const target=document.querySelector('.ic.drag-over');
      if(target){
        target.classList.remove('drag-over');
        const toId=target.querySelector('.drag-handle')?.dataset.dragId;
        if(toId&&toId!==_touchItem){
          const fromIdx=S.invItems.findIndex(i=>i.id===_touchItem);
          const toIdx=S.invItems.findIndex(i=>i.id===toId);
          if(fromIdx>=0&&toIdx>=0){
            const item=S.invItems.splice(fromIdx,1)[0];
            S.invItems.splice(toIdx,0,item);
            await saveA('inv_items',S.invItems);re();
          }
        }
      }
      _touchItem=null;
    });
  });
}

function copyText(txt,cb){
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(cb).catch(()=>fb(txt,cb));
  else fb(txt,cb);
}
function fb(txt,cb){const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);if(cb)cb();}
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);}

function copyRep(){const m=S.forms.repM||nowM();copyText(genMonthRep(m),()=>{S.forms.copied=true;re();setTimeout(()=>{S.forms.copied=false;re();},2200);});}
function exportCSV(){const m=S.forms.repM||nowM();dl(`OOKO_${m}_明細.csv`,genCSV(m),'text/csv');showToast('✓ CSV 已下載');}
function exportNotion(){const m=S.forms.repM||nowM();S.forms.repTxt=genMonthRep(m);S.modals.repTxt=true;re();}
function exportAnnCSV(){const y=S.forms.repY||new Date().getFullYear().toString();dl(`OOKO_${y}年度.csv`,genAnnCSV(y),'text/csv');showToast('✓ 年報 CSV 已下載');}
function exportAnnNotion(){const y=S.forms.repY||new Date().getFullYear().toString();S.forms.repTxt=genAnnRep(y);S.modals.repTxt=true;re();}
function copyRepTxt(){copyText(S.forms.repTxt||'',()=>showToast('✓ 已複製 Copied'));}

function exportJSON(){
  const data={exps:S.exps,sals:S.sals,prods:S.prods,settings:S.settings,invItems:S.invItems,invTx:S.invTx,invConsign:S.invConsign,channels:S.channels,expCats:S.expCats,customOrders:S.customOrders,consignSettlements:S.consignSettlements,at:new Date().toISOString(),v:'ooko_v7'};
  dl(`OOKO_備份_${toDay()}.json`,JSON.stringify(data,null,2),'application/json');
  showToast('✓ 備份已下載 💾');
}
async function importJSON(file){
  const r=new FileReader();
  r.onload=async e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.v||!d.exps||!d.sals){alert('格式不符');return;}
      if(!confirm(`還原備份？ 支出${d.exps.length}筆 銷售${d.sals.length}筆 ⚠覆蓋現有資料`))return;
      S.exps=d.exps;await saveA('exps',S.exps);
      S.sals=d.sals;await saveA('sals',S.sals);
      if(d.prods?.length){S.prods=d.prods;await saveA('prods',S.prods);}
      if(d.settings){S.settings={...DEFAULT_SETTINGS,...d.settings};await saveO('settings',S.settings);}
      if(d.invItems?.length){S.invItems=d.invItems;await saveA('inv_items',S.invItems);}
      if(d.invTx){S.invTx=d.invTx;await saveA('inv_tx',S.invTx);}
      if(d.invConsign){S.invConsign=d.invConsign;await saveO('inv_consign',S.invConsign);}
      if(d.channels?.length){S.channels=d.channels;await saveA('channels',S.channels);}
      if(d.expCats?.length){S.expCats=d.expCats;await saveA('expCats',S.expCats);}
      if(d.customOrders){S.customOrders=d.customOrders;await saveA('customOrders',S.customOrders);}
      if(d.consignSettlements){S.consignSettlements=d.consignSettlements;await saveA('consignSettlements',S.consignSettlements);}
      delete S.modals.backup;
      showToast('✓ 備份還原成功 🌸');
    }catch(err){alert('讀取失敗：'+err.message);}
  };
  r.readAsText(file);
}

async function loadDemo(){
  const tm=nowM(),lm=new Date(new Date().setMonth(new Date().getMonth()-1)).toISOString().slice(0,7);
  const d=(m,n)=>`${m}-${String(n).padStart(2,'0')}`;
  const p0=S.prods[0],p3=S.prods[3]||S.prods[0],p8=S.prods[8]||S.prods[0],p11=S.prods[11]||S.prods[0];
  const mkSal=(date,prod,qty,ch)=>{
    const cons=S.settings.consign||CONSIGN_DEF;const rate=cons[ch];
    const subtotal=Math.round(prod.price*qty*(rate||1));const retail=prod.price*qty;
    const cost=prodCost(prod)*qty;const profit=subtotal-cost;
    return{id:uid(),date,product:`${prod.name} ${prod.en||''}`.trim(),price:prod.price,qty,subtotal,retail,channel:ch,cost,profit,profitRate:subtotal>0?profit/subtotal:0};
  };
  S.sals=[
    mkSal(d(tm,3),p0,2,'Instagram 直售'),mkSal(d(tm,7),p3,1,'moonstone 寄賣'),
    mkSal(d(tm,12),p8,2,'jiang space 寄賣'),mkSal(d(tm,18),p11,1,'市集現場'),
    mkSal(d(lm,5),p0,3,'Line 直售'),mkSal(d(lm,20),p3,2,'moonstone 寄賣'),
  ];
  S.exps=[
    {id:uid(),date:d(tm,2),category:'材料',description:'薰衣草精油 50ml×3',amount:1800,payMethod:PAY[0],supplier:'淘寶',note:''},
    {id:uid(),date:d(tm,2),category:'材料',description:'香氛玻璃瓶×30個',amount:1200,payMethod:PAY[0],supplier:'淘寶',note:''},
    {id:uid(),date:d(tm,8),category:'行銷',description:'Instagram 推廣',amount:500,payMethod:PAY[1],supplier:'',note:''},
    {id:uid(),date:d(tm,15),category:'物流',description:'宅配運費 5筆',amount:350,payMethod:PAY[1],supplier:'',note:''},
    {id:uid(),date:d(lm,3),category:'材料',description:'佛手柑精油×2',amount:960,payMethod:PAY[0],supplier:'淘寶',note:''},
  ];
  await saveA('sals',S.sals);await saveA('exps',S.exps);
  showToast('✦ 示範資料已載入 ✨');
}

// ── INIT ──────────────────────────────────────
async function init(){
  const[exps,sals,prods,settings,invItems,invTx,invConsign,channels,expCats,customOrders,consignSettlements]=await Promise.all([
    loadA('exps'),loadA('sals'),loadA('prods'),
    loadO('settings',DEFAULT_SETTINGS),
    loadA('inv_items'),loadA('inv_tx'),loadO('inv_consign',{}),
    loadA('channels'),loadA('expCats'),
    loadA('customOrders'),loadA('consignSettlements'),
  ]);
  S.exps=exps;S.sals=sals;
  if(prods&&prods.length)S.prods=prods;
  if(settings)S.settings={...DEFAULT_SETTINGS,...settings};
  if(invItems&&invItems.length)S.invItems=invItems;
  if(invTx)S.invTx=invTx;
  if(invConsign)S.invConsign=invConsign;
  if(channels&&channels.length)S.channels=channels;
  if(expCats&&expCats.length)S.expCats=expCats;
  if(customOrders)S.customOrders=customOrders;
  if(consignSettlements)S.consignSettlements=consignSettlements;
  S.forms={salOpen:true,expOpen:true,invTxOpen:true};
  render();
}
init();
