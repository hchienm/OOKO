// 【防卡死裝甲】加入 timeout 避免資料庫掛起導致白屏
function openDB(){
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej(new Error("DB Timeout")), 3000);
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    r.onsuccess=e=>{clearTimeout(t);res(e.target.result)};
    r.onerror=()=>{clearTimeout(t);rej(r.error)};
    r.onblocked=()=>{clearTimeout(t);rej(new Error("DB Blocked"))};
  })
}
async function dbG(k){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>r2(r.result??null);r.onerror=()=>rj(r.error)})}catch{return null}}
async function dbS(k,v){try{const db=await openDB();return new Promise((r2,rj)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>r2(true);r.onerror=()=>rj(r.error)})}catch{return false}}
async function loadA(k){try{const r=await dbG(k);return r?JSON.parse(r):[]}catch{return[]}}
async function loadO(k,d){try{const r=await dbG(k);return r?JSON.parse(r):d}catch{return d}}
async function saveA(k,d){await dbS(k,JSON.stringify(d))}
async function saveO(k,d){await dbS(k,JSON.stringify(d))}

function findProdInvItem(prodName){
  return S.invItems.find(i=>i.cat==='成品'&&i.name===prodName);
}

async function deductFinishedStock(prodName,qty){
  const item=findProdInvItem(prodName);
  if(!item){return{ok:false,msg:'找不到成品庫存「'+prodName+'」'};}
  const before=item.qty;
  item.qty=Math.max(0,item.qty-qty);
  await saveA('inv_items',S.invItems);
  if(before<qty)return{ok:true,warn:true,msg:'⚠ 庫存不足！「'+prodName+'」只有 '+before+' 瓶，已扣為 0'};
  return{ok:true,warn:false};
}
async function restoreFinishedStock(prodName,qty){
  const item=findProdInvItem(prodName);
  if(!item)return false;
  item.qty+=qty;
  await saveA('inv_items',S.invItems);
  return true;
}

function renderModals(){
  let h='';
  if(S.modals.backup)h+=backupModal();
  if(S.modals.settings)h+=settingsModal();
  if(S.modals.addItem)h+=addItemModal();
  if(S.modals.manage)h+=manageModal();
  if(S.modals.send)h+=sendModal();
  if(S.modals.qkStock)h+=quickModal();
  if(S.modals.stocktake)h+=stocktakeModal();
  if(S.modals.repTxt)h+=repTxtModal();
  if(S.modals.produce)h+=produceModal();
  return h;
}

const MH=(t,s='')=>`<div class="mh"><div class="mt">${esc(t)}</div>${s?`<div class="ms">${esc(s)}</div>`:''}</div>`;

function produceModal(){
  const f=S.forms.produceF||{prodName:S.prods[0]?.name||'',qty:'',items:{}};
  const prod=S.prods.find(p=>p.name===f.prodName);
  const qty=parseInt(f.qty)||0;
  
  // 優化：多選清單取代固定下拉
  const mats=S.invItems.filter(i=>i.cat==='原料'||i.cat==='包材');
  let totalCo2e = 0;
  mats.forEach(m=>{
    if(f.items?.[m.id]?.checked) totalCo2e += (m.co2e||0) * (f.items[m.id].useQty||1);
  });

  return`<div class="overlay" data-a="closeM" data-m="produce"><div class="modal" onclick="event.stopPropagation()">
${MH('🧪 多選製作 Produce','從材料庫勾選消耗品項')}
<div class="mb">
  <div class="f"><label>製作產品</label>
    <select class="inp" data-b="produceF.prodName">${S.prods.map(p=>`<option value="${esc(p.name)}"${f.prodName===p.name?' selected':''}>${esc(p.name)} (Lv${p.level||1})</option>`).join('')}</select>
  </div>
  <div class="f"><label>製作數量（瓶/個）</label>
    <input class="inp" type="number" min="1" value="${esc(f.qty)}" data-b="produceF.qty" placeholder="0" style="font-size:22px;font-weight:800;text-align:center">
  </div>
  <div class="f"><label>勾選本次消耗材料 (自動扣庫存)</label>
    <div style="max-height:220px;overflow-y:auto;border:2px solid var(--bdL);border-radius:10px;padding:8px;background:var(--bg)">
    ${mats.map(m=>{
      const c=f.items?.[m.id]||{checked:false,useQty:1};
      return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;background:var(--sf);padding:8px;border-radius:8px;border:1px solid ${c.checked?'var(--coral)':'var(--bdL)'}">
        <input type="checkbox" ${c.checked?'checked':''} style="width:18px;height:18px" data-a="toggleProduceMat" data-id="${m.id}">
        <div style="flex:1"><div style="font-size:12px;font-weight:700">${esc(m.name)}</div><div style="font-size:10px;color:var(--muted)">庫存: ${m.qty}${esc(m.unit)}</div></div>
        ${c.checked?`<input class="inp" type="number" min="0" step="0.1" value="${c.useQty}" style="width:65px;padding:6px;text-align:center" data-b="produceMatQty.${m.id}">`:''}
      </div>`
    }).join('')}
    </div>
  </div>
  ${qty>0?`<div style="background:var(--mintL);border:2px solid var(--mintM);border-radius:12px;padding:12px 16px;margin-bottom:12px;text-align:center">
    <div style="font-size:11px;font-weight:700;color:var(--mint)">產出 Output & 碳足跡</div>
    <div style="font-size:20px;font-weight:800;color:var(--green)">+${qty} 個 ${esc(prod?.name||'')}</div>
    <div style="font-size:11px;font-weight:700;color:var(--mint);margin-top:4px">本次估算碳排: ${totalCo2e.toFixed(3)} kgCO2e</div>
  </div>`:''}
  <button class="btn bm" data-a="confirmProduce" style="margin-bottom:8px">✓ 確認製作並扣除庫存</button>
  <button class="btn bo" data-a="closeM" data-m="produce">取消</button>
</div></div></div>`;
}

// BINDING & ACTIONS
function bindAll(){
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{S.tab=el.dataset.tab;re();}));
  document.querySelectorAll('[data-b]').forEach(el=>{
    el.addEventListener('input',()=>bind(el.dataset.b,el.value));
    el.addEventListener('change',()=>bind(el.dataset.b,el.value));
  });
  document.querySelectorAll('[data-a]').forEach(el=>{
    if(el.tagName==='INPUT'&&el.type==='file'){el.addEventListener('change',()=>{if(el.files[0])importJSON(el.files[0]);});return;}
    el.addEventListener('click',e=>{e.stopPropagation();act(el.dataset.a,el.dataset);});
  });
  initDrag();
}

function bind(path,val){
  const p=path.split('.');
  if(p[0]==='sal'){if(!S.forms.sal)S.forms.sal={date:toDay(),prodIdx:0,qty:1,channel:S.channels.find(c=>!c.includes('寄賣'))||S.channels[0]};S.forms.sal[p[1]]=p[1]==='prodIdx'?parseInt(val):val;if(p[1]==='qty'||p[1]==='prodIdx')re();}
  else if(p[0]==='salC'){if(!S.forms.salC)S.forms.salC={date:toDay(),prodIdx:0,qty:1};S.forms.salC[p[1]]=p[1]==='prodIdx'?parseInt(val):val;if(p[1]==='prodIdx')re();}
  else if(p[0]==='exp'){if(!S.forms.exp)S.forms.exp={date:toDay(),category:S.expCats[0],description:'',amount:'',currency:'TWD',origin:'',payMethod:PAY[0],supplier:'',note:''};S.forms.exp[p[1]]=val;if(p[1]==='currency')re();}
  else if(p[0]==='invF'){if(!S.forms.invF)S.forms.invF={date:toDay(),itemId:'',type:'in',qty:'',currency:'TWD',unitCost:'',store:'',note:''};S.forms.invF[p[1]]=val;if(p[1]==='type'||p[1]==='currency')re();}
  else if(p[0]==='customF'){if(!S.forms.customF)S.forms.customF={date:toDay(),customerName:'',product:'',totalAmt:'',depositAmt:'',depositDate:toDay(),status:'pending',note:'',customCost:'',isConsign:false,consignStore:getStores()[0]||'moonstone',consignRate:0.70};S.forms.customF[p[1]]=val;if(p[1]==='isConsign')re();}
  else if(p[0]==='newItem'){if(!S.forms.newItem)S.forms.newItem={name:'',en:'',cat:'包材',unit:'個',qty:0,safe:10,unitCost:0,co2e:0};S.forms.newItem[p[1]]=val;}

}
